<!DOCTYPE html>
<html lang="te">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>యోహాను 17–21 · 100 ప్రశ్నలు</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Ramaraja&family=Noto+Serif+Telugu:wght@400;500;600;700&family=EB+Garamond:ital@0;1&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #1b1420;
      --ink-2: #281c2a;
      --panel: #2d2030;
      --gold: #c9a227;
      --gold-lit: #e4c766;
      --ivory: #f3eadb;
      --ivory-dim: #c7bba9;
      --sage: #8aa05a;
      --rust: #b45c42;
      --hair: rgba(201, 162, 39, .28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: "Noto Serif Telugu", serif;
      background: radial-gradient(120% 80% at 50% -10%, #2a1c2c 0%, var(--ink) 55%, #150f19 100%);
      color: var(--ivory);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      width: 100%;
      max-width: 640px;
      background: linear-gradient(180deg, var(--ink-2), var(--panel));
      border: 1px solid var(--hair);
      border-radius: 6px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .02);
      position: relative;
      overflow: hidden;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 52px;
      height: 52px;
      pointer-events: none;
      border: 1px solid var(--gold);
      opacity: .5;
    }

    .frame::before {
      top: 10px;
      left: 10px;
      border-right: 0;
      border-bottom: 0
    }

    .frame::after {
      bottom: 10px;
      right: 10px;
      border-left: 0;
      border-top: 0
    }

    .pad {
      padding: 34px 30px 30px
    }

    @media(max-width:480px) {
      .pad {
        padding: 28px 20px 24px
      }
    }

    .eyebrow {
      font-family: "EB Garamond", serif;
      font-style: italic;
      letter-spacing: .12em;
      color: var(--gold-lit);
      font-size: .84rem;
      text-align: center;
      margin-bottom: 6px
    }

    h1 {
      font-family: "Ramaraja", serif;
      font-weight: 400;
      font-size: clamp(2.2rem, 8.5vw, 3.2rem);
      line-height: 1.05;
      text-align: center;
      color: var(--ivory)
    }

    .rule {
      width: 74px;
      height: 1px;
      margin: 15px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent)
    }

    .lede {
      text-align: center;
      color: var(--ivory-dim);
      font-size: 1rem;
      line-height: 1.7;
      margin: 18px auto 4px;
      max-width: 46ch
    }

    .meta {
      font-family: "EB Garamond", serif;
      color: var(--gold-lit);
      text-align: center;
      font-size: .95rem;
      margin-top: 12px;
      opacity: .85
    }

    .btn {
      font-family: "Noto Serif Telugu", serif;
      font-weight: 600;
      font-size: 1.03rem;
      cursor: pointer;
      border: 0;
      color: var(--ink);
      background: linear-gradient(180deg, var(--gold-lit), var(--gold));
      padding: 13px 26px;
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(201, 162, 39, .28);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease, opacity .16s ease
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.05)
    }

    .btn:active:not(:disabled) {
      transform: translateY(0)
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold-lit);
      outline-offset: 3px
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      box-shadow: none
    }

    .btn.ghost {
      background: transparent;
      color: var(--gold-lit);
      box-shadow: none;
      border: 1px solid var(--hair);
      font-weight: 500;
      font-size: .95rem;
      padding: 11px 16px
    }

    .btn.ghost:hover:not(:disabled) {
      background: rgba(201, 162, 39, .08);
      filter: none
    }

    .btn.ghost:disabled {
      opacity: .3
    }

    .center {
      display: flex;
      justify-content: center;
      margin-top: 24px
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px
    }

    .counter {
      font-family: "EB Garamond", serif;
      color: var(--ivory-dim);
      font-size: .9rem;
      white-space: nowrap;
      min-width: 52px
    }

    .track {
      flex: 1;
      height: 5px;
      background: rgba(0, 0, 0, .35);
      border-radius: 99px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--gold), var(--gold-lit));
      border-radius: 99px;
      transition: width .4s cubic-bezier(.4, 0, .2, 1)
    }

    .scorepill {
      font-family: "EB Garamond", serif;
      color: var(--sage);
      font-size: .9rem;
      white-space: nowrap
    }

    .qtag {
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--gold-lit);
      font-size: .9rem;
      letter-spacing: .05em;
      margin: 22px 0 8px
    }

    .qtext {
      font-size: 1.24rem;
      line-height: 1.55;
      font-weight: 600;
      color: var(--ivory);
      margin-bottom: 20px
    }

    @media(max-width:480px) {
      .qtext {
        font-size: 1.12rem
      }
    }

    .answer {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    input[type=text] {
      flex: 1;
      min-width: 180px;
      font-family: "Noto Serif Telugu", serif;
      font-size: 1.08rem;
      color: var(--ivory);
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(201, 162, 39, .3);
      border-radius: 4px;
      padding: 13px 15px;
      outline: none;
      transition: border-color .15s ease, background .15s ease
    }

    input[type=text]:focus {
      border-color: var(--gold);
      background: rgba(201, 162, 39, .06)
    }

    input[type=text]::placeholder {
      color: rgba(199, 187, 169, .5)
    }

    input[type=text]:disabled {
      opacity: .7
    }

    .actions {
      margin-top: 10px
    }

    .verdict {
      margin-top: 16px;
      min-height: 1.4em;
      font-size: 1.02rem;
      line-height: 1.6
    }

    .verdict.ok {
      color: var(--sage);
      font-weight: 600
    }

    .verdict.no {
      color: var(--rust);
      font-weight: 600
    }

    .verdict.neutral {
      color: var(--gold-lit);
      font-weight: 600
    }

    .model {
      margin-top: 10px;
      color: var(--ivory);
      font-size: 1.02rem;
      line-height: 1.6
    }

    .model .lab {
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--ivory-dim);
      margin-right: 6px
    }

    .scripture {
      margin-top: 16px;
      padding: 14px 16px 14px 18px;
      border-left: 2px solid var(--gold);
      background: rgba(201, 162, 39, .06);
      border-radius: 0 4px 4px 0;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--ivory-dim);
    }

    .scripture .ref {
      display: block;
      margin-top: 8px;
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--gold-lit);
      font-size: .9rem
    }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      min-height: 52px;
      flex-wrap: wrap
    }

    .foot .right {
      display: flex;
      gap: 10px;
      margin-left: auto;
      align-items: center;
      flex-wrap: wrap
    }

    .score-num {
      font-family: "Ramaraja", serif;
      font-size: clamp(3.2rem, 15vw, 5rem);
      line-height: 1;
      text-align: center;
      color: var(--gold-lit)
    }

    .score-of {
      font-family: "EB Garamond", serif;
      color: var(--ivory-dim);
      font-size: 1.1rem;
      text-align: center
    }

    .verse {
      text-align: center;
      font-size: 1.06rem;
      line-height: 1.7;
      color: var(--ivory);
      margin: 20px auto 4px;
      max-width: 42ch
    }

    .verse .cite {
      display: block;
      margin-top: 10px;
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--gold-lit);
      font-size: .95rem
    }

    .fade {
      animation: fade .35s ease both
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .hidden {
      display: none
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="pad">

      <section id="start" class="fade">
        <p class="eyebrow">సువార్త · యోహాను రచించినది</p>
        <h1>యోహాను<br>17 – 21</h1>
        <div class="rule"></div>
        <p class="lede">యేసు ప్రార్థన, ఆయన బంధింపబడుట, సిలువ, పునరుత్థానము, పేతురు పునఃస్థాపన — ఐదు అధ్యాయములపై 100
          ప్రశ్నలు. జవాబును మీరే టైప్ చేయండి; ఒక పదము చాలు.</p>
        <p class="meta">100 ప్రశ్నలు · మునుపటి/తరువాత నావిగేషన్ · జవాబు చూపు సౌకర్యము</p>
        <div class="center"><button class="btn" id="startBtn">మొదలుపెట్టు</button></div>
      </section>

      <section id="quiz" class="hidden">
        <div class="top">
          <span class="counter" id="counter">1 / 100</span>
          <div class="track">
            <div class="fill" id="fill"></div>
          </div>
          <span class="scorepill" id="scorepill">✦ 0</span>
        </div>
        <p class="qtag" id="qtag"></p>
        <h2 class="qtext" id="qtext"></h2>
        <div class="answer">
          <input type="text" id="input" placeholder="ఇక్కడ జవాబు రాయండి…" autocomplete="off" autocapitalize="off"
            spellcheck="false">
          <button class="btn" id="submitBtn" disabled>సమర్పించు</button>
        </div>
        <div class="actions" id="actions">
          <button class="btn ghost" id="showBtn">జవాబు చూపించు</button>
        </div>
        <div class="verdict" id="verdict"></div>
        <div class="model hidden" id="model"></div>
        <div class="scripture hidden" id="scripture"></div>
        <div class="foot">
          <button class="btn ghost" id="prevBtn">← మునుపటి</button>
          <div class="right">
            <button class="btn ghost hidden" id="markBtn">నా జవాబు సరైనది ✓</button>
            <button class="btn" id="nextBtn">తరువాత →</button>
          </div>
        </div>
      </section>

      <section id="result" class="hidden">
        <p class="eyebrow">ఫలితము</p>
        <div class="score-num" id="scoreNum">0</div>
        <p class="score-of">100 లో <span id="scoreDen">0</span></p>
        <div class="rule"></div>
        <p class="verse" id="verse"></p>
        <div class="center"><button class="btn" id="againBtn">మళ్లీ ఆడు</button></div>
      </section>

    </div>
  </div>

  <script>
    const V = {
      "17:1": "యేసు ఈ మాటలు చెప్పి ఆకాశమువైపు కన్నులెత్తి ఇట్లనెను — తండ్రీ, నా ఘడియ వచ్చియున్నది.",
      "17:2": "నీ కుమారుడు నిన్ను మహిమపరచునట్లు నీ కుమారుని మహిమపరచుము. నీవు నీ కుమారునికిచ్చిన వారికందరికిని ఆయన నిత్య జీవము అనుగ్రహించునట్లు సర్వశరీరుల మీదను ఆయనకు అధికారమిచ్చితివి.",
      "17:3": "అద్వితీయ సత్యదేవుడవైన నిన్నును, నీవు పంపిన యేసుక్రీస్తును ఎరుగటయే నిత్యజీవము.",
      "17:4": "చేయుటకు నీవు నాకిచ్చిన పని నేను సంపూర్ణముగా నెరవేర్చి భూమిమీద నిన్ను మహిమ పరచితిని.",
      "17:5": "తండ్రీ, లోకము పుట్టకమునుపు నీయొద్ద నాకు మహిమయుండెనో ఆ మహిమతో నన్ను ఇప్పుడు నీయొద్ద మహిమపరచుము.",
      "17:6": "లోకము నుండి నీవు నాకు అనుగ్రహించిన మనుష్యులకు నీ నామమును ప్రత్యక్ష పరచితిని. వారు నీవారైయుండిరి, నీవు వారిని నాకనుగ్రహించితివి; వారు నీ వాక్యము గైకొని యున్నారు.",
      "17:8": "నీవు నాకు అనుగ్రహించినవన్నియు నీవలననే కలిగినవని వారిప్పుడు ఎరిగియున్నారు.",
      "17:9": "నేను వారి కొరకు ప్రార్థన చేయుచున్నాను. లోకము కొరకు ప్రార్థన చేయుటలేదు, నీవు నాకు అనుగ్రహించి యున్నవారు నీవారైనందున వారి కొరకే ప్రార్థన చేయుచున్నాను.",
      "17:11": "నేనికను లోకములో ఉండను, గాని వీరు లోకములో ఉన్నారు; నేను నీ యొద్దకు వచ్చుచున్నాను. పరిశుద్ధుడవైన తండ్రీ, మనము ఏకమైయున్నట్లు వారును ఏకమైయుండునట్లు నీవు నాకు అనుగ్రహించిన నీ నామమందు వారిని కాపాడుము.",
      "17:12": "నేను వారియొద్ద ఉండగా నీవు నాకు అనుగ్రహించినవారిని నీ నామమందు కాపాడితిని; నేను వారిని భద్రపరచితిని గనుక లేఖనము నెరవేరునట్లు నాశనపుత్రుడు తప్ప వారిలో మరి ఎవడును నశింపలేదు.",
      "17:14": "వారికి నీ వాక్యమిచ్చి యున్నాను. నేను లోకసంబంధిని కానట్టు వారును లోకసంబంధులు కారు గనుక లోకము వారిని ద్వేషించును.",
      "17:15": "నీవు లోకములో నుండి వారిని తీసికొనిపొమ్మని నేను ప్రార్థించుటలేదు గాని దుష్టుని నుండి వారిని కాపాడుమని ప్రార్థించుచున్నాను.",
      "17:17": "సత్యమందు వారిని ప్రతిష్ఠ చేయుము; నీ వాక్యమే సత్యము.",
      "17:18": "నీవు నన్ను లోకమునకు పంపిన ప్రకారము నేనును వారిని లోకమునకు పంపితిని.",
      "17:21": "వారి వాక్యమువలన నాయందు విశ్వాసముంచు వారందరును ఏకమైయుండవలెనని వారికొరకును ప్రార్థించుచున్నాను.",
      "17:24": "తండ్రీ, నేనెక్కడ ఉందునో అక్కడ నీవు నాకు అనుగ్రహించిన వారును నాతోకూడ ఉండవలెననియు, నీవు నాకు అనుగ్రహించిన నా మహిమను వారు చూడవలెననియు కోరుచున్నాను. జగత్తు పునాది వేయబడక మునుపే నీవు నన్ను ప్రేమించితివి.",
      "17:26": "నీవు నాయందు ఉంచిన ప్రేమ వారియందు ఉండునట్లును, నేను వారియందు ఉండునట్లును, వారికి నీ నామమును తెలియజేసితిని, ఇంకను తెలియజేసెదనని చెప్పెను.",
      "18:1": "యేసు ఈ మాటలు చెప్పి తన శిష్యులతో కూడ కెద్రోను వాగు దాటి పోయెను. అక్కడ ఒక తోట యుండెను, దానిలోనికి ఆయన తన శిష్యులతో కూడ వెళ్లెను.",
      "18:2": "యేసు తన శిష్యులతో పలుమారు అక్కడికి వెళ్లుచుండువాడు గనుక, ఆయనను అప్పగించు యూదాకును ఆ స్థలము తెలిసియుండెను.",
      "18:3": "కావున యూదా — సైనికులను, ప్రధాన యాజకులు పరిసయ్యులు పంపిన బంట్రౌతులను వెంటబెట్టుకొని, దివిటీలతోను, దీపములతోను ఆయుధములతోను అక్కడికి వచ్చెను.",
      "18:5": "వారు — నజరేయుడైన యేసునని ఆయనకు ఉత్తరమియ్యగా, యేసు — ఆయనను నేనే అని వారితో చెప్పెను; ఆయనను అప్పగించిన యూదాయు వారి యొద్ద నిలిచుండెను.",
      "18:6": "ఆయన — నేనే ఆయనను అని వారితో చెప్పగా, వారు వెనుకకు తగ్గి నేల మీద పడిరి.",
      "18:10": "సీమోను పేతురునొద్ద కత్తియుండినందున అతడు దాని దూసి, ప్రధానయాజకుని దాసుని కొట్టి అతని కుడిచెవి తెగ నరికెను.",
      "18:11": "ఆ దాసుని పేరు మల్కు. యేసు — కత్తి ఒరలో ఉంచుము, తండ్రి నాకు అనుగ్రహించిన గిన్నెలోనిది నేను త్రాగకుందునా? అని పేతురుతో అనెను.",
      "18:13": "అతడు ఆ సంవత్సరము ప్రధానయాజకుడైన కయపకు మామ.",
      "18:14": "కయప — ఒక మనుష్యుడు ప్రజల కొరకు చనిపోవుట ప్రయోజనకరమని యూదులకు ఆలోచన చెప్పినవాడు.",
      "18:17": "ద్వారమునొద్ద కావలియున్న యొక చిన్నది పేతురుతో — నీవును ఈ మనుష్యుని శిష్యులలో ఒకడవు కావా? అని చెప్పగా, అతడు — కాననెను.",
      "18:27": "పేతురు నేనెరుగనని మరియొకసారి చెప్పెను; వెంటనే కోడి కూసెను.",
      "18:28": "వారు కయప యొద్ద నుండి అధికార మందిరమునకు యేసును తీసికొనిపోయిరి. అప్పుడు ఉదయమాయెను గనుక వారు మైలపడకుండ పస్కాను భుజింపవలెనని అధికార మందిరములోనికి వెళ్లలేదు.",
      "18:33": "పిలాతు తిరిగి అధికారమందిరములో ప్రవేశించి యేసును పిలిపించి — యూదుల రాజవు నీవేనా? అని ఆయన నడుగగా,",
      "18:36": "యేసు — నా రాజ్యము ఇహసంబంధమైనది కాదు. నా రాజ్యము ఈ లోక సంబంధమైనదైతే నేను యూదులకు అప్పగింపబడకుండునట్లు నా సేవకులు పోరాడుదురు గాని నా రాజ్యము ఇహసంబంధమైనది కాదు అనెను.",
      "18:40": "అయితే వారు — వీనిని వద్దు, బరబ్బను విడుదల చేయుమని కేకలువేసిరి. ఈ బరబ్బ బందిపోటు దొంగ.",
      "19:1": "అప్పుడు పిలాతు యేసును పట్టుకొని ఆయనను కొరడాలతో కొట్టించెను.",
      "19:2": "సైనికులు ముండ్లతో కిరీటమును అల్లి ఆయన తల మీద పెట్టి,",
      "19:2-3": "సైనికులు ముండ్లతో కిరీటమును అల్లి ఆయన తల మీద పెట్టి, ఊదారంగు వస్త్రము ఆయనకు తొడిగించి, ఆయన యొద్దకు వచ్చి — యూదుల రాజా, శుభమని చెప్పి ఆయనను అరచేతులతో కొట్టిరి.",
      "19:3": "ఊదారంగు వస్త్రము ఆయనకు తొడిగించి, ఆయన యొద్దకు వచ్చి — యూదుల రాజా, శుభమని చెప్పి ఆయనను అరచేతులతో కొట్టిరి.",
      "19:6": "ప్రధానయాజకులును బంట్రౌతులును ఆయనను చూచి — సిలువవేయుము సిలువవేయుము అని కేకలు వేయగా, పిలాతు — ఆయనయందు ఏ దోషమును నాకు కనబడలేదు గనుక మీరే ఆయనను తీసికొనిపోయి సిలువ వేయుడని వారితో చెప్పెను.",
      "19:7": "అందుకు యూదులు — మాకొక నియమము కలదు; తాను దేవుని కుమారుడనని ఇతడు చెప్పుకొనెను గనుక ఆ నియమముచొప్పున ఇతడు చావవలెనని అతనితో చెప్పిరి.",
      "19:13": "పిలాతు ఈ మాటలు విని, యేసును బయటికి తీసికొనివచ్చి, రాళ్లు పరచిన స్థలమందు న్యాయపీఠముమీద కూర్చుండెను. హెబ్రీ భాషలో ఆ స్థలమునకు గబ్బతా అని పేరు.",
      "19:14": "ఆ దినము పస్కాను సిద్ధపరచు దినము; అప్పుడు ఉదయము ఆరు గంటలు కావచ్చెను. అతడు — ఇదిగో మీ రాజు అని యూదులతో చెప్పగా,",
      "19:15": "అందుకు వారు — ఇతనిని సంహరించుము, సంహరించుము, సిలువవేయుము అని కేకలు వేసిరి. పిలాతు — మీ రాజును సిలువవేయుదునా? అని వారిని అడుగగా, ప్రధానయాజకులు — కైసరు తప్ప మాకు వేరొక రాజు లేడనిరి.",
      "19:17": "వారు యేసును తీసికొనిపోయిరి. ఆయన తన సిలువ మోసికొని కపాలస్థలమను చోటికి వెళ్లెను. హెబ్రీ భాషలో దానికి గొల్గొతా అని పేరు.",
      "19:19": "మరియు పిలాతు — యూదులరాజైన నజరేయుడగు యేసు అను పైవిలాసము వ్రాయించి సిలువ మీద పెట్టించెను.",
      "19:20": "యేసు సిలువవేయబడిన స్థలము పట్టణమునకు సమీపమై యుండెను, అది హెబ్రీ, గ్రీకు, రోమా భాషలలో వ్రాయబడెను గనుక యూదులలో అనేకులు దానిని చదివిరి.",
      "19:23": "సైనికులు యేసును సిలువవేసిన తరువాత ఆయన వస్త్రములు తీసికొని, ఒక్కొక్క సైనికునికి ఒక్కొక భాగము వచ్చునట్లు వాటిని నాలుగు భాగములు చేసిరి. ఆయన అంగీని కూడ తీసికొని, ఆ అంగీ కుట్టులేక పైనుండి యావత్తు నేయబడినది గనుక",
      "19:24": "వారు — దానిని చింపక అది ఎవనికి వచ్చునో అని దాని కోసరము చీట్లు వేయుదమని ఒకరితో ఒకరు చెప్పుకొనిరి. ఇందుకే సైనికులు ఈలాగు చేసిరి.",
      "19:26-27": "యేసు తన తల్లియు తాను ప్రేమించిన శిష్యుడును దగ్గర నిలుచుండుట చూచి — అమ్మా, ఇదిగో నీ కుమారుడు అని తన తల్లితో చెప్పెను. తరువాత శిష్యుని చూచి — ఇదిగో నీ తల్లి అని చెప్పెను. ఆ ఘడియ నుండి ఆ శిష్యుడు ఆమెను తన యింట చేర్చుకొనెను.",
      "19:28": "అటుతరువాత సమస్తమును అప్పటికి సమాప్తమైనదని యేసు ఎరిగి, లేఖనము నెరవేరునట్లు — నేను దప్పిగొనుచున్నాననెను.",
      "19:30": "యేసు ఆ చిరక పుచ్చుకొని — సమాప్తమైనదని చెప్పి తల వంచి ఆత్మను అప్పగించెను.",
      "19:34": "సైనికులలో ఒకడు ఈటెతో ఆయన ప్రక్కను పొడిచెను, వెంటనే రక్తమును నీళ్లును కారెను.",
      "19:38": "అటు తరువాత, యూదుల భయమువలన రహస్యముగా యేసు శిష్యుడైన అరిమతయియ యోసేపు, తాను యేసు దేహమును తీసికొనిపోవుటకు పిలాతునొద్ద సెలవడిగెను; పిలాతు సెలవిచ్చెను. గనుక అతడు వచ్చి యేసు దేహమును తీసికొని పోయెను.",
      "19:41": "ఆయనను సిలువవేసిన స్థలములో ఒక తోట యుండెను; ఆ తోటలో ఎవడును ఎప్పుడును ఉంచబడని క్రొత్త సమాధి యొకటి యుండెను.",
      "20:1": "ఆదివారమున ఇంకను చీకటిగా ఉన్నప్పుడు మగ్దలేనే మరియ పెందలకడ సమాధియొద్దకు వచ్చి, సమాధి మీద ఉండిన రాయి తీయబడియుండుట చూచెను,",
      "20:2": "గనుక ఆమె పరుగెత్తికొని సీమోను పేతురు నొద్దకును యేసు ప్రేమించిన ఆ మరియొక శిష్యునియొద్దకు వచ్చి — ప్రభువును సమాధిలోనుండి యెత్తికొనిపోయిరి, ఆయనను ఎక్కడ ఉంచిరో ఎరుగమని చెప్పెను.",
      "20:4": "వారిద్దరును కూడ పరుగెత్తుచుండగా, ఆ శిష్యుడు పేతురుకంటె త్వరగా పరుగెత్తి ముందుగా సమాధియొద్దకు వచ్చి,",
      "20:5": "వంగి నారబట్టలు పడియుండుట చూచెను గాని అతడు సమాధిలో ప్రవేశింపలేదు.",
      "20:7": "నారబట్టలు పడియుండుటయు, ఆయన తల రుమాలు నారబట్టల యొద్ద ఉండక వేరుగా ఒకచోట చుట్టిపెట్టియుండుటయు చూచెను.",
      "20:8": "అప్పుడు మొదట సమాధియొద్దకు వచ్చిన ఆ శిష్యుడు లోపలికి పోయి చూచి నమ్మెను.",
      "20:12": "తెల్లని వస్త్రములు ధరించిన యిద్దరు దేవదూతలు యేసు దేహము ఉంచబడిన స్థలములో తలవైపున ఒకడును, కాళ్ళవైపున మరియొకడును కూర్చుండుట కనబడెను.",
      "20:15": "యేసు — అమ్మా, ఎందుకు ఏడ్చుచున్నావు? ఎవనిని వెదకుచున్నావు? అని ఆమెనడుగగా, ఆమె ఆయన తోటమాలి అనుకొని — అయ్యా, నీవు ఆయనను మోసికొని పోయినయెడల ఆయనను ఎక్కడ ఉంచితివో నాతో చెప్పుము, నేను ఆయనను ఎత్తికొని పోదునని చెప్పెను.",
      "20:16": "యేసు ఆమెను చూచి — మరియా అని పిలిచెను. ఆమె ఆయనవైపు తిరిగి హెబ్రీ భాషలో — రబ్బూనీ అని పిలిచెను. ఆ మాటకు బోధకుడా అని అర్థము.",
      "20:17": "యేసు ఆమెతో — నేను ఇంకను తండ్రి యొద్దకు ఎక్కి పోలేదు గనుక నన్ను ముట్టుకొనవద్దు; అయితే నా సహోదరుల యొద్దకు వెళ్ళి — నా తండ్రియు మీ తండ్రియు నా దేవుడును మీ దేవుడునైన వాని యొద్దకు ఎక్కి పోవుచున్నానని వారితో చెప్పుమనెను.",

      "21:1": "అటు తరువాత యేసు తిబెరియ సముద్ర తీరమున శిష్యులకు మరల తన్ను ప్రత్యక్షపరచుకొనెను. ఆయన తన్ను ప్రత్యక్షపరచుకొనిన విధమేదనగా —",
      "21:2": "సీమోను పేతురును, దిదుమ అనబడిన తోమాయు, గలిలయలోని కానా అను ఊరివాడగు నతనయేలును, జెబెదయి కుమాళ్లును, ఆయన శిష్యులలో మరి ఇద్దరును కూడియుండిరి.",
      "21:3": "సీమోను పేతురు — నేను చేపలు పట్టబోదును అని వారితో అనగా, వారు — మేమును నీతో కూడ వచ్చెదమనిరి. వారు వెళ్లి దోనె ఎక్కిరి కాని ఆ రాత్రి ఏమియు పట్టలేదు.",

      { r: "21:3", q: "ఆ రాత్రి వారు ఎంత పట్టిరి?", a: "ఏమియు పట్టలేదు", k: ["ఏమియు", "పట్టలేదు"] },
      { r: "21:6", q: "యేసు వలను దోనె ఏ ప్రక్క వేయుమనెను?", a: "కుడి ప్రక్క", k: ["కుడి"] },
      { r: "21:7", q: "\"ఆయన ప్రభువు సుమీ\" అని ఎవరు చెప్పెను?", a: "యేసు ప్రేమించిన శిష్యుడు", k: ["ప్రేమించిన", "శిష్యు"] },
      { r: "21:7", q: "ప్రభువని విని పేతురు ఏమి చేసెను?", a: "సముద్రములో దుమికెను", k: ["దుమిక", "సముద్రము"] },
      { r: "21:11", q: "వల ఎన్ని గొప్ప చేపలతో నిండియుండెను?", a: "నూటఏబదిమూడు", k: ["నూటఏబదిమూడు", "153", "నూటయేబది"] },
      { r: "21:11", q: "అంత విస్తారమైనను వల ఏమైంది?", a: "పిగలలేదు", k: ["పిగల"] },
      { r: "21:12", q: "యేసు వారిని ఏమని పిలిచెను?", a: "రండి, భోజనము చేయుడి", k: ["భోజనము", "రండి"] },
      { r: "21:13", q: "యేసు వారికి ఏమి పంచిపెట్టెను?", a: "రొట్టెను, చేపలను", k: ["రొట్టె", "చేపలు"] },
      { r: "21:14", q: "ఇది యేసు శిష్యులకు ప్రత్యక్షమైనది ఎన్నవసారి?", a: "మూడవసారి", k: ["మూడవ"] },
      { r: "21:15", q: "యేసు పేతురును ఎవరి కుమారుడని పిలిచెను?", a: "యోహాను కుమారుడు", k: ["యోహాను"] },
      { r: "21:15", q: "మొదటిసారి యేసు పేతురును ఏమి మేపుమనెను?", a: "నా గొఱ్ఱెపిల్లలను", k: ["గొఱ్ఱెపిల్ల", "గొఱ్ఱె"] },
      { r: "21:16", q: "రెండవసారి యేసు ఏమి కాయుమనెను?", a: "నా గొఱ్ఱెలను", k: ["గొఱ్ఱె"] },
      { r: "21:17", q: "యేసు ఎన్నిసార్లు \"నన్ను ప్రేమించుచున్నావా\" అని అడిగెను?", a: "మూడుసార్లు", k: ["మూడు"] },
      { r: "21:17", q: "మూడవసారి అడిగినందుకు పేతురు ఏమాయెను?", a: "వ్యసనపడెను", k: ["వ్యసన"] },
      { r: "21:18", q: "పేతురు ముసలివాడైనప్పుడు ఎవరు అతని నడుము కట్టి మోసికొనిపోవును?", a: "వేరొకడు", k: ["వేరొక"] },
      { r: "21:22", q: "యేసు పేతురుతో \"నీవు నన్ను ___\" అనెను?", a: "వెంబడించుము", k: ["వెంబడించు"] },
      { r: "21:25", q: "యేసు కార్యములన్నిటిని వ్రాసినయెడల దేనికి చాలదని తోచును?", a: "భూలోకమునకు", k: ["భూలోక"] },
    ];

    const $ = id => document.getElementById(id);
    let idx = 0, A = [];

    function norm(s) {
      return (s || "")
        .replace(/[\s\u200b\u200c\u200d]/g, "")
        .replace(/[.,!?;:'"“”‘’()\-–—।]/g, "")
        .trim();
    }
    function check(input, keys) {
      const n = norm(input);
      if (n.length < 2) return false;
      return keys.some(k => { const nk = norm(k); return nk && (n.includes(nk) || nk.includes(n)); });
    }
    function scoreCount() { return A.filter(a => a && (a.correct || a.selfMarked)).length; }
    function doneCount() { return A.filter(a => a && a.done).length; }

    function start() {
      idx = 0;
      A = Q.map(() => ({ typed: "", done: false, correct: false, selfMarked: false, shown: false }));
      $('start').classList.add('hidden');
      $('result').classList.add('hidden');
      $('quiz').classList.remove('hidden');
      render();
    }

    function render() {
      const item = Q[idx], cur = A[idx];
      $('counter').textContent = `${idx + 1} / ${Q.length}`;
      $('fill').style.width = `${doneCount() / Q.length * 100}%`;
      $('scorepill').textContent = `✦ ${scoreCount()}`;
      $('qtag').textContent = `యోహాను ${item.r}`;
      $('qtext').textContent = item.q;

      const inp = $('input');
      inp.value = cur.typed || "";

      $('prevBtn').disabled = (idx === 0);
      $('nextBtn').textContent = (idx === Q.length - 1) ? 'ఫలితము చూడు' : 'తరువాత →';

      if (cur.done) {
        inp.disabled = true;
        $('submitBtn').classList.add('hidden');
        $('showBtn').classList.add('hidden');
        $('model').classList.remove('hidden');
        $('model').innerHTML = `<span class="lab">సరైన జవాబు:</span>${item.a}`;
        const vt = V[item.r];
        if (vt) {
          $('scripture').classList.remove('hidden');
          $('scripture').innerHTML = `${vt}<span class="ref">— యోహాను ${item.r}</span>`;
        } else { $('scripture').classList.add('hidden'); }
        if (cur.correct || cur.selfMarked) {
          $('verdict').className = "verdict ok";
          $('verdict').textContent = (cur.selfMarked && !cur.correct) ? "✦ సరైనదిగా లెక్కించబడింది" : "✦ సరైనది";
          $('markBtn').classList.add('hidden');
        } else if (cur.shown) {
          $('verdict').className = "verdict neutral";
          $('verdict').textContent = "👁 జవాబు చూపబడింది";
          $('markBtn').classList.add('hidden');
        } else {
          $('verdict').className = "verdict no";
          $('verdict').textContent = "✕ తప్పు";
          $('markBtn').classList.remove('hidden');
        }
      } else {
        inp.disabled = false;
        $('submitBtn').classList.remove('hidden');
        $('submitBtn').disabled = (inp.value.trim() === "");
        $('showBtn').classList.remove('hidden');
        $('verdict').textContent = ""; $('verdict').className = "verdict";
        $('model').classList.add('hidden'); $('model').textContent = "";
        $('scripture').classList.add('hidden'); $('scripture').textContent = "";
        $('markBtn').classList.add('hidden');
      }
      const qt = $('qtext'); qt.classList.remove('fade'); void qt.offsetWidth; qt.classList.add('fade');
      if (!cur.done) inp.focus(); else $('nextBtn').focus();
    }

    function submit() {
      const cur = A[idx];
      if (cur.done) return;
      if ($('input').value.trim() === "") return;   // never act on an empty field
      cur.typed = $('input').value;
      cur.correct = check(cur.typed, Q[idx].k);
      cur.done = true; cur.shown = false;
      render();
    }
    function showAnswer() {
      const cur = A[idx];
      if (cur.done) return;
      cur.typed = $('input').value;   // keep whatever was typed
      cur.done = true; cur.shown = true; cur.correct = false;
      render();
    }
    function selfMark() {
      const cur = A[idx];
      if (cur.correct || cur.selfMarked) return;
      cur.selfMarked = true;
      render();
    }
    function prev() { if (idx > 0) { idx--; render(); } }
    function next() {
      if (idx < Q.length - 1) { idx++; render(); }
      else finish();
    }

    function finish() {
      const score = scoreCount();
      $('quiz').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('result').classList.add('fade');
      $('scoreNum').textContent = score;
      $('scoreDen').textContent = score;
      const pct = score / Q.length;
      let v;
      if (pct === 1) v = `"చూడక నమ్మినవారు ధన్యులు."<span class="cite">సంపూర్ణము! — యోహాను 20:29</span>`;
      else if (pct >= .75) v = `"యేసు దేవుని కుమారుడైన క్రీస్తు అని నమ్మి, ఆయన నామమందు జీవము పొందుడి."<span class="cite">బహు చక్కగా — యోహాను 20:31</span>`;
      else if (pct >= .5) v = `"నా గొఱ్ఱెపిల్లలను మేపుము."<span class="cite">మంచి ప్రయత్నము — యోహాను 21:15</span>`;
      else v = `"నీ వాక్యమే సత్యము."<span class="cite">మరల చదివి ప్రయత్నించండి — యోహాను 17:17</span>`;
      $('verse').innerHTML = v;
    }

    $('startBtn').onclick = start;
    $('againBtn').onclick = start;
    $('submitBtn').onclick = submit;
    $('showBtn').onclick = showAnswer;
    $('markBtn').onclick = selfMark;
    $('prevBtn').onclick = prev;
    $('nextBtn').onclick = next;

    // keep typed text live + CTA disabled while empty
    $('input').addEventListener('input', () => {
      A[idx].typed = $('input').value;
      if (!A[idx].done) $('submitBtn').disabled = ($('input').value.trim() === "");
    });
    // Enter submits a typed answer only — it never skips/navigates
    $('input').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
  </script>
</body>

</html>
