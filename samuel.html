<!DOCTYPE html>
<html lang="te">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2 సమూయేలు 11–24 · 420 ప్రశ్నలు</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Ramaraja&family=Noto+Serif+Telugu:wght@400;500;600;700&family=EB+Garamond:ital@0;1&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #191320;
      --ink-2: #241a29;
      --panel: #2a1e2f;
      --gold: #c9a227;
      --gold-lit: #e4c766;
      --ivory: #f3eadb;
      --ivory-dim: #c7bba9;
      --sage: #8aa05a;
      --rust: #b45c42;
      --hair: rgba(201, 162, 39, .28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: "Noto Serif Telugu", serif;
      background: radial-gradient(120% 80% at 50% -10%, #291b2b 0%, var(--ink) 55%, #130e18 100%);
      color: var(--ivory);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      width: 100%;
      max-width: 660px;
      background: linear-gradient(180deg, var(--ink-2), var(--panel));
      border: 1px solid var(--hair);
      border-radius: 6px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .02);
      position: relative;
      overflow: hidden;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 52px;
      height: 52px;
      pointer-events: none;
      border: 1px solid var(--gold);
      opacity: .5;
    }

    .frame::before {
      top: 10px;
      left: 10px;
      border-right: 0;
      border-bottom: 0
    }

    .frame::after {
      bottom: 10px;
      right: 10px;
      border-left: 0;
      border-top: 0
    }

    .pad {
      padding: 34px 30px 30px
    }

    @media(max-width:480px) {
      .pad {
        padding: 28px 20px 24px
      }
    }

    .eyebrow {
      font-family: "EB Garamond", serif;
      font-style: italic;
      letter-spacing: .12em;
      color: var(--gold-lit);
      font-size: .84rem;
      text-align: center;
      margin-bottom: 6px
    }

    h1 {
      font-family: "Ramaraja", serif;
      font-weight: 400;
      font-size: clamp(2.1rem, 8vw, 3.1rem);
      line-height: 1.05;
      text-align: center;
      color: var(--ivory)
    }

    .rule {
      width: 74px;
      height: 1px;
      margin: 15px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent)
    }

    .lede {
      text-align: center;
      color: var(--ivory-dim);
      font-size: 1rem;
      line-height: 1.7;
      margin: 18px auto 4px;
      max-width: 46ch
    }

    .meta {
      font-family: "EB Garamond", serif;
      color: var(--gold-lit);
      text-align: center;
      font-size: .95rem;
      margin-top: 12px;
      opacity: .85
    }

    .btn {
      font-family: "Noto Serif Telugu", serif;
      font-weight: 600;
      font-size: 1.03rem;
      cursor: pointer;
      border: 0;
      color: var(--ink);
      background: linear-gradient(180deg, var(--gold-lit), var(--gold));
      padding: 13px 26px;
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(201, 162, 39, .28);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease, opacity .16s ease
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.05)
    }

    .btn:active:not(:disabled) {
      transform: translateY(0)
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold-lit);
      outline-offset: 3px
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      box-shadow: none
    }

    .btn.ghost {
      background: transparent;
      color: var(--gold-lit);
      box-shadow: none;
      border: 1px solid var(--hair);
      font-weight: 500;
      font-size: .95rem;
      padding: 11px 16px
    }

    .btn.ghost:hover:not(:disabled) {
      background: rgba(201, 162, 39, .08);
      filter: none
    }

    .btn.ghost:disabled {
      opacity: .3
    }

    .center {
      display: flex;
      justify-content: center;
      margin-top: 24px
    }

    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap
    }

    .counter {
      font-family: "EB Garamond", serif;
      color: var(--ivory-dim);
      font-size: .88rem;
      white-space: nowrap;
      min-width: 60px
    }

    .track {
      flex: 1;
      min-width: 110px;
      height: 5px;
      background: rgba(0, 0, 0, .35);
      border-radius: 99px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--gold), var(--gold-lit));
      border-radius: 99px;
      transition: width .4s cubic-bezier(.4, 0, .2, 1)
    }

    .scorepill {
      font-family: "EB Garamond", serif;
      color: var(--sage);
      font-size: .88rem;
      white-space: nowrap
    }

    select {
      font-family: "Noto Serif Telugu", serif;
      font-size: .88rem;
      color: var(--gold-lit);
      background: rgba(0, 0, 0, .3);
      border: 1px solid var(--hair);
      border-radius: 3px;
      padding: 6px 8px;
      outline: none;
      cursor: pointer
    }

    select:focus {
      border-color: var(--gold)
    }

    .qtag {
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--gold-lit);
      font-size: .9rem;
      letter-spacing: .05em;
      margin: 20px 0 8px
    }

    .qtext {
      font-size: 1.22rem;
      line-height: 1.55;
      font-weight: 600;
      color: var(--ivory);
      margin-bottom: 20px
    }

    @media(max-width:480px) {
      .qtext {
        font-size: 1.1rem
      }
    }

    .answer {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    input[type=text] {
      flex: 1;
      min-width: 180px;
      font-family: "Noto Serif Telugu", serif;
      font-size: 1.06rem;
      color: var(--ivory);
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(201, 162, 39, .3);
      border-radius: 4px;
      padding: 13px 15px;
      outline: none;
      transition: border-color .15s ease, background .15s ease
    }

    input[type=text]:focus {
      border-color: var(--gold);
      background: rgba(201, 162, 39, .06)
    }

    input[type=text]::placeholder {
      color: rgba(199, 187, 169, .5)
    }

    input[type=text]:disabled {
      opacity: .7
    }

    .actions {
      margin-top: 10px
    }

    .verdict {
      margin-top: 16px;
      min-height: 1.4em;
      font-size: 1.02rem;
      line-height: 1.6
    }

    .verdict.ok {
      color: var(--sage);
      font-weight: 600
    }

    .verdict.no {
      color: var(--rust);
      font-weight: 600
    }

    .verdict.neutral {
      color: var(--gold-lit);
      font-weight: 600
    }

    .model {
      margin-top: 10px;
      color: var(--ivory);
      font-size: 1.02rem;
      line-height: 1.6
    }

    .model .lab {
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--ivory-dim);
      margin-right: 6px
    }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      min-height: 52px;
      flex-wrap: wrap
    }

    .foot .right {
      display: flex;
      gap: 10px;
      margin-left: auto;
      align-items: center;
      flex-wrap: wrap
    }

    .score-num {
      font-family: "Ramaraja", serif;
      font-size: clamp(3rem, 14vw, 4.6rem);
      line-height: 1;
      text-align: center;
      color: var(--gold-lit)
    }

    .score-of {
      font-family: "EB Garamond", serif;
      color: var(--ivory-dim);
      font-size: 1.1rem;
      text-align: center
    }

    .verse {
      text-align: center;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--ivory);
      margin: 20px auto 4px;
      max-width: 42ch
    }

    .verse .cite {
      display: block;
      margin-top: 10px;
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--gold-lit);
      font-size: .95rem
    }

    .fade {
      animation: fade .3s ease both
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .hidden {
      display: none
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="pad">

      <section id="start" class="fade">
        <p class="eyebrow">పరిశుద్ధ గ్రంథము · పాత నిబంధన</p>
        <h1>2 సమూయేలు<br>11 – 24</h1>
        <div class="rule"></div>
        <p class="lede">బత్షెబ, నాతాను ఉపమానము, అమ్నోను–తామారు, అబ్షాలోము తిరుగుబాటు, షెబ, దావీదు గీతము, బలాఢ్యులు,
          జనసంఖ్య — 14 అధ్యాయములు, ఒక్కొక్క అధ్యాయమునకు 30 ప్రశ్నలు.</p>
        <p class="meta">420 ప్రశ్నలు · అధ్యాయము వారీ నావిగేషన్ · జవాబు చూపు సౌకర్యము</p>
        <div class="center"><button class="btn" id="startBtn">మొదలుపెట్టు</button></div>
      </section>

      <section id="quiz" class="hidden">
        <div class="top">
          <span class="counter" id="counter">1 / 420</span>
          <div class="track">
            <div class="fill" id="fill"></div>
          </div>
          <select id="chapSel" aria-label="అధ్యాయము"></select>
          <span class="scorepill" id="scorepill">✦ 0</span>
        </div>
        <p class="qtag" id="qtag"></p>
        <h2 class="qtext" id="qtext"></h2>
        <div class="answer">
          <input type="text" id="input" placeholder="ఇక్కడ జవాబు రాయండి…" autocomplete="off" autocapitalize="off"
            spellcheck="false">
          <button class="btn" id="submitBtn" disabled>సమర్పించు</button>
        </div>
        <div class="actions">
          <button class="btn ghost" id="showBtn">జవాబు చూపించు</button>
        </div>
        <div class="verdict" id="verdict"></div>
        <div class="model hidden" id="model"></div>
        <div class="foot">
          <button class="btn ghost" id="prevBtn">← మునుపటి</button>
          <div class="right">
            <button class="btn ghost hidden" id="markBtn">నా జవాబు సరైనది ✓</button>
            <button class="btn" id="nextBtn">తరువాత →</button>
          </div>
        </div>
      </section>

      <section id="result" class="hidden">
        <p class="eyebrow">ఫలితము</p>
        <div class="score-num" id="scoreNum">0</div>
        <p class="score-of">420 లో <span id="scoreDen">0</span></p>
        <div class="rule"></div>
        <p class="verse" id="verse"></p>
        <div class="center"><button class="btn" id="againBtn">మళ్లీ ఆడు</button></div>
      </section>

    </div>
  </div>

  <script>
    const Q = [
      // ===== అధ్యాయము 11 =====
      { c: 11, r: "11:1", q: "వసంతకాలమున రాజులు దేనికి బయలుదేరుదురు?", a: "యుద్ధమునకు", k: ["యుద్ధ"] },
      { c: 11, r: "11:1", q: "దావీదు యుద్ధమునకు ఎవరిని పంపెను?", a: "యోవాబును, అతనివారిని, ఇశ్రాయేలీయులనందరిని", k: ["యోవాబు"] },
      { c: 11, r: "11:1", q: "వారు ఏ పట్టణమును ముట్టడివేసిరి?", a: "రబ్బా", k: ["రబ్బా"] },
      { c: 11, r: "11:1", q: "దావీదు ఎక్కడ నిలిచెను?", a: "యెరూషలేమునందు", k: ["యెరూషలేము"] },
      { c: 11, r: "11:2", q: "దావీదు ఎక్కడ నడుచుచుండెను?", a: "రాజనగరి మిద్దెమీద", k: ["మిద్దె", "నగరి"] },
      { c: 11, r: "11:2", q: "పైనుండి చూచుచుండగా అతనికి ఏమి కనబడెను?", a: "స్నానముచేయు ఒక స్త్రీ", k: ["స్నాన", "స్త్రీ"] },
      { c: 11, r: "11:3", q: "ఆ స్త్రీ పేరు ఏమి?", a: "బత్షెబ", k: ["బత్షెబ"] },
      { c: 11, r: "11:3", q: "బత్షెబ ఎవరి కుమార్తె?", a: "ఏలీయాము", k: ["ఏలీయాము"] },
      { c: 11, r: "11:3", q: "బత్షెబ ఎవరి భార్య?", a: "హిత్తీయుడగు ఊరియా", k: ["ఊరియా", "హిత్తీయ"] },
      { c: 11, r: "11:4", q: "దావీదు ఆమెను ఎట్లు పిలిపించెను?", a: "దూతలచేత", k: ["దూత"] },
      { c: 11, r: "11:5", q: "ఆమె దావీదునకు ఏమని వర్తమానము పంపెను?", a: "నేను గర్భవతినైతిని", k: ["గర్భవతి", "గర్భ"] },
      { c: 11, r: "11:6", q: "దావీదు యోవాబునకు ఏమని ఆజ్ఞ ఇచ్చెను?", a: "ఊరియాను నాయొద్దకు పంపుము", k: ["ఊరియా"] },
      { c: 11, r: "11:7", q: "దావీదు ఊరియాను ఏమి అడిగెను?", a: "యోవాబు, జనుల యోగక్షేమము, యుద్ధసమాచారము", k: ["యోగక్షేమ", "యుద్ధసమాచార", "యుద్ధ"] },
      { c: 11, r: "11:8", q: "దావీదు ఊరియాకు ఏమి సెలవిచ్చెను?", a: "ఇంటికి పోయి శ్రమ తీర్చుకొనుము", k: ["ఇంటికి", "శ్రమ"] },
      { c: 11, r: "11:9", q: "ఊరియా ఎక్కడ పండుకొనెను?", a: "రాజనగరి ద్వారమున, సేవకులతో కూడ", k: ["ద్వార", "నగరి"] },
      { c: 11, r: "11:11", q: "ఊరియా ఇంటికి పోనని ఏ కారణము చెప్పెను?", a: "మందసమును, ఇశ్రాయేలు యూదావారును గుడారములలో ఉండగా", k: ["మందసము", "గుడార"] },
      { c: 11, r: "11:12", q: "ఊరియా ఎన్ని దినములు యెరూషలేములో నిలిచెను?", a: "ఆ నాడును మరునాడును", k: ["మరునాడు", "రెండు"] },
      { c: 11, r: "11:13", q: "దావీదు ఊరియాను ఏమి చేసెను?", a: "మత్తునిగా చేసెను", k: ["మత్తు"] },
      { c: 11, r: "11:13", q: "మత్తుడైన తరువాత ఊరియా ఎక్కడ పండుకొనెను?", a: "యేలినవాని సేవకుల మధ్య పడకమీద", k: ["సేవకుల", "పడక"] },
      { c: 11, r: "11:14", q: "దావీదు ఎవరికి ఉత్తరము వ్రాయించెను?", a: "యోవాబునకు", k: ["యోవాబు"] },
      { c: 11, r: "11:15", q: "ఆ ఉత్తరములోని ఆజ్ఞ ఏమి?", a: "యుద్ధము మోపుగా జరుగుచోట ఊరియాను ముందుపెట్టి విడిచిపొమ్ము", k: ["ముందుపెట్టి", "మోపుగా", "హతమగునట్లు"] },
      { c: 11, r: "11:15", q: "ఆ ఉత్తరమును ఎవరిచేత పంపెను?", a: "ఊరియాచేతనే", k: ["ఊరియా"] },
      { c: 11, r: "11:16", q: "యోవాబు ఊరియాను ఎక్కడికి పంపెను?", a: "ధైర్యవంతులుండు స్థలమునకు", k: ["ధైర్యవంతు"] },
      { c: 11, r: "11:17", q: "ఊరియాకు ఏమాయెను?", a: "హతమాయెను", k: ["హత", "చనిపో"] },

    const $ = id => document.getElementById(id);
    let idx = 0, A = [];

    function norm(s) {
      return (s || "")
        .replace(/[\s\u200b\u200c\u200d]/g, "")
        .replace(/[.,!?;:'"“”‘’()\-–—।]/g, "")
        .trim();
    }
    function check(input, keys) {
      const n = norm(input);
      if (n.length < 2) return false;
      return keys.some(k => { const nk = norm(k); return nk && (n.includes(nk) || nk.includes(n)); });
    }
    function scoreCount() { return A.filter(a => a && (a.correct || a.selfMarked)).length; }
    function doneCount() { return A.filter(a => a && a.done).length; }

    function buildChapterSelect() {
      const sel = $('chapSel'); sel.innerHTML = '';
      const seen = {};
      Q.forEach((q, i) => { if (!(q.c in seen)) seen[q.c] = i; });
      Object.keys(seen).sort((a, b) => a - b).forEach(c => {
        const o = document.createElement('option');
        o.value = seen[c]; o.textContent = 'అధ్యా. ' + c;
        sel.appendChild(o);
      });
      sel.onchange = () => { idx = +sel.value; render(); };
    }

    function start() {
      idx = 0;
      A = Q.map(() => ({ typed: "", done: false, correct: false, selfMarked: false, shown: false }));
      $('start').classList.add('hidden');
      $('result').classList.add('hidden');
      $('quiz').classList.remove('hidden');
      buildChapterSelect();
      render();
    }

    function render() {
      const item = Q[idx], cur = A[idx];
      $('counter').textContent = `${idx + 1} / ${Q.length}`;
      $('fill').style.width = `${doneCount() / Q.length * 100}%`;
      $('scorepill').textContent = `✦ ${scoreCount()}`;
      $('qtag').textContent = `2 సమూయేలు ${item.r}`;
      $('qtext').textContent = item.q;
      $('chapSel').value = [...$('chapSel').options].filter(o => +o.value <= idx).pop().value;

      const inp = $('input');
      inp.value = cur.typed || "";

      $('prevBtn').disabled = (idx === 0);
      $('nextBtn').textContent = (idx === Q.length - 1) ? 'ఫలితము చూడు' : 'తరువాత →';

      if (cur.done) {
        inp.disabled = true;
        $('submitBtn').classList.add('hidden');
        $('showBtn').classList.add('hidden');
        $('model').classList.remove('hidden');
        $('model').innerHTML = `<span class="lab">సరైన జవాబు:</span>${item.a}`;
        if (cur.correct || cur.selfMarked) {
          $('verdict').className = "verdict ok";
          $('verdict').textContent = (cur.selfMarked && !cur.correct) ? "✦ సరైనదిగా లెక్కించబడింది" : "✦ సరైనది";
          $('markBtn').classList.add('hidden');
        } else if (cur.shown) {
          $('verdict').className = "verdict neutral";
          $('verdict').textContent = "👁 జవాబు చూపబడింది";
          $('markBtn').classList.add('hidden');
        } else {
          $('verdict').className = "verdict no";
          $('verdict').textContent = "✕ తప్పు";
          $('markBtn').classList.remove('hidden');
        }
      } else {
        inp.disabled = false;
        $('submitBtn').classList.remove('hidden');
        $('submitBtn').disabled = (inp.value.trim() === "");
        $('showBtn').classList.remove('hidden');
        $('verdict').textContent = ""; $('verdict').className = "verdict";
        $('model').classList.add('hidden'); $('model').textContent = "";
        $('markBtn').classList.add('hidden');
      }
      const qt = $('qtext'); qt.classList.remove('fade'); void qt.offsetWidth; qt.classList.add('fade');
      if (!cur.done) inp.focus(); else $('nextBtn').focus();
    }

    function submit() {
      const cur = A[idx];
      if (cur.done) return;
      if ($('input').value.trim() === "") return;   // never act on an empty field
      cur.typed = $('input').value;
      cur.correct = check(cur.typed, Q[idx].k);
      cur.done = true; cur.shown = false;
      render();
    }
    function showAnswer() {
      const cur = A[idx];
      if (cur.done) return;
      cur.typed = $('input').value;
      cur.done = true; cur.shown = true; cur.correct = false;
      render();
    }
    function selfMark() {
      const cur = A[idx];
      if (cur.correct || cur.selfMarked) return;
      cur.selfMarked = true;
      render();
    }
    function prev() { if (idx > 0) { idx--; render(); } }
    function next() {
      if (idx < Q.length - 1) { idx++; render(); }
      else finish();
    }

    function finish() {
      const score = scoreCount();
      $('quiz').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('result').classList.add('fade');
      $('scoreNum').textContent = score;
      $('scoreDen').textContent = score;
      const pct = score / Q.length;
      let v;
      if (pct === 1) v = `"యెహోవా నా శైలము, నా కోట, నా రక్షకుడు."<span class="cite">సంపూర్ణము! — 2 సమూయేలు 22:2</span>`;
      else if (pct >= .75) v = `"యెహోవా వాక్కు నిర్మలము; ఆయన శరణుజొచ్చువారికందరికి ఆయన కేడెము."<span class="cite">బహు చక్కగా — 2 సమూయేలు 22:31</span>`;
      else if (pct >= .5) v = `"నీ సహాయముచేత నేను సైన్యములను జయింతును."<span class="cite">మంచి ప్రయత్నము — 2 సమూయేలు 22:30</span>`;
      else v = `"నేను పాపము చేసితిని."<span class="cite">మరల చదివి ప్రయత్నించండి — 2 సమూయేలు 12:13</span>`;
      $('verse').innerHTML = v;
    }

    $('startBtn').onclick = start;
    $('againBtn').onclick = start;
    $('submitBtn').onclick = submit;
    $('showBtn').onclick = showAnswer;
    $('markBtn').onclick = selfMark;
    $('prevBtn').onclick = prev;
    $('nextBtn').onclick = next;

    $('input').addEventListener('input', () => {
      A[idx].typed = $('input').value;
      if (!A[idx].done) $('submitBtn').disabled = ($('input').value.trim() === "");
    });
    // Enter submits a typed answer only — it never skips or navigates
    $('input').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
  </script>
</body>

</html>
