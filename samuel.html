<!DOCTYPE html>
<html lang="te">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2 సమూయేలు 11–24 · 420 ప్రశ్నలు</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Ramaraja&family=Noto+Serif+Telugu:wght@400;500;600;700&family=EB+Garamond:ital@0;1&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #191320;
      --ink-2: #241a29;
      --panel: #2a1e2f;
      --gold: #c9a227;
      --gold-lit: #e4c766;
      --ivory: #f3eadb;
      --ivory-dim: #c7bba9;
      --sage: #8aa05a;
      --rust: #b45c42;
      --hair: rgba(201, 162, 39, .28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: "Noto Serif Telugu", serif;
      background: radial-gradient(120% 80% at 50% -10%, #291b2b 0%, var(--ink) 55%, #130e18 100%);
      color: var(--ivory);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      width: 100%;
      max-width: 660px;
      background: linear-gradient(180deg, var(--ink-2), var(--panel));
      border: 1px solid var(--hair);
      border-radius: 6px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .02);
      position: relative;
      overflow: hidden;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 52px;
      height: 52px;
      pointer-events: none;
      border: 1px solid var(--gold);
      opacity: .5;
    }

    .frame::before {
      top: 10px;
      left: 10px;
      border-right: 0;
      border-bottom: 0
    }

    .frame::after {
      bottom: 10px;
      right: 10px;
      border-left: 0;
      border-top: 0
    }

    .pad {
      padding: 34px 30px 30px
    }

    @media(max-width:480px) {
      .pad {
        padding: 28px 20px 24px
      }
    }

    .eyebrow {
      font-family: "EB Garamond", serif;
      font-style: italic;
      letter-spacing: .12em;
      color: var(--gold-lit);
      font-size: .84rem;
      text-align: center;
      margin-bottom: 6px
    }

    h1 {
      font-family: "Ramaraja", serif;
      font-weight: 400;
      font-size: clamp(2.1rem, 8vw, 3.1rem);
      line-height: 1.05;
      text-align: center;
      color: var(--ivory)
    }

    .rule {
      width: 74px;
      height: 1px;
      margin: 15px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent)
    }

    .lede {
      text-align: center;
      color: var(--ivory-dim);
      font-size: 1rem;
      line-height: 1.7;
      margin: 18px auto 4px;
      max-width: 46ch
    }

    .meta {
      font-family: "EB Garamond", serif;
      color: var(--gold-lit);
      text-align: center;
      font-size: .95rem;
      margin-top: 12px;
      opacity: .85
    }

    .btn {
      font-family: "Noto Serif Telugu", serif;
      font-weight: 600;
      font-size: 1.03rem;
      cursor: pointer;
      border: 0;
      color: var(--ink);
      background: linear-gradient(180deg, var(--gold-lit), var(--gold));
      padding: 13px 26px;
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(201, 162, 39, .28);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease, opacity .16s ease
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.05)
    }

    .btn:active:not(:disabled) {
      transform: translateY(0)
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold-lit);
      outline-offset: 3px
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      box-shadow: none
    }

    .btn.ghost {
      background: transparent;
      color: var(--gold-lit);
      box-shadow: none;
      border: 1px solid var(--hair);
      font-weight: 500;
      font-size: .95rem;
      padding: 11px 16px
    }

    .btn.ghost:hover:not(:disabled) {
      background: rgba(201, 162, 39, .08);
      filter: none
    }

    .btn.ghost:disabled {
      opacity: .3
    }

    .center {
      display: flex;
      justify-content: center;
      margin-top: 24px
    }

    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap
    }

    .counter {
      font-family: "EB Garamond", serif;
      color: var(--ivory-dim);
      font-size: .88rem;
      white-space: nowrap;
      min-width: 60px
    }

    .track {
      flex: 1;
      min-width: 110px;
      height: 5px;
      background: rgba(0, 0, 0, .35);
      border-radius: 99px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--gold), var(--gold-lit));
      border-radius: 99px;
      transition: width .4s cubic-bezier(.4, 0, .2, 1)
    }

    .scorepill {
      font-family: "EB Garamond", serif;
      color: var(--sage);
      font-size: .88rem;
      white-space: nowrap
    }

    select {
      font-family: "Noto Serif Telugu", serif;
      font-size: .88rem;
      color: var(--gold-lit);
      background: rgba(0, 0, 0, .3);
      border: 1px solid var(--hair);
      border-radius: 3px;
      padding: 6px 8px;
      outline: none;
      cursor: pointer
    }

    select:focus {
      border-color: var(--gold)
    }

    .qtag {
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--gold-lit);
      font-size: .9rem;
      letter-spacing: .05em;
      margin: 20px 0 8px
    }

    .qtext {
      font-size: 1.22rem;
      line-height: 1.55;
      font-weight: 600;
      color: var(--ivory);
      margin-bottom: 20px
    }

    @media(max-width:480px) {
      .qtext {
        font-size: 1.1rem
      }
    }

    .answer {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    input[type=text] {
      flex: 1;
      min-width: 180px;
      font-family: "Noto Serif Telugu", serif;
      font-size: 1.06rem;
      color: var(--ivory);
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(201, 162, 39, .3);
      border-radius: 4px;
      padding: 13px 15px;
      outline: none;
      transition: border-color .15s ease, background .15s ease
    }

    input[type=text]:focus {
      border-color: var(--gold);
      background: rgba(201, 162, 39, .06)
    }

    input[type=text]::placeholder {
      color: rgba(199, 187, 169, .5)
    }

    input[type=text]:disabled {
      opacity: .7
    }

    .actions {
      margin-top: 10px
    }

    .verdict {
      margin-top: 16px;
      min-height: 1.4em;
      font-size: 1.02rem;
      line-height: 1.6
    }

    .verdict.ok {
      color: var(--sage);
      font-weight: 600
    }

    .verdict.no {
      color: var(--rust);
      font-weight: 600
    }

    .verdict.neutral {
      color: var(--gold-lit);
      font-weight: 600
    }

    .model {
      margin-top: 10px;
      color: var(--ivory);
      font-size: 1.02rem;
      line-height: 1.6
    }

    .model .lab {
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--ivory-dim);
      margin-right: 6px
    }

    .scripture {
      margin-top: 16px;
      padding: 14px 16px 14px 18px;
      border-left: 2px solid var(--gold);
      background: rgba(201, 162, 39, .06);
      border-radius: 0 4px 4px 0;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--ivory-dim);
    }

    .scripture .ref {
      display: block;
      margin-top: 8px;
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--gold-lit);
      font-size: .9rem
    }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      min-height: 52px;
      flex-wrap: wrap
    }

    .foot .right {
      display: flex;
      gap: 10px;
      margin-left: auto;
      align-items: center;
      flex-wrap: wrap
    }

    .score-num {
      font-family: "Ramaraja", serif;
      font-size: clamp(3rem, 14vw, 4.6rem);
      line-height: 1;
      text-align: center;
      color: var(--gold-lit)
    }

    .score-of {
      font-family: "EB Garamond", serif;
      color: var(--ivory-dim);
      font-size: 1.1rem;
      text-align: center
    }

    .verse {
      text-align: center;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--ivory);
      margin: 20px auto 4px;
      max-width: 42ch
    }

    .verse .cite {
      display: block;
      margin-top: 10px;
      font-family: "EB Garamond", serif;
      font-style: italic;
      color: var(--gold-lit);
      font-size: .95rem
    }

    .fade {
      animation: fade .3s ease both
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .hidden {
      display: none
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="pad">

      <section id="start" class="fade">
        <p class="eyebrow">పరిశుద్ధ గ్రంథము · పాత నిబంధన</p>
        <h1>2 సమూయేలు<br>11 – 24</h1>
        <div class="rule"></div>
        <p class="lede">బత్షెబ, నాతాను ఉపమానము, అమ్నోను–తామారు, అబ్షాలోము తిరుగుబాటు, షెబ, దావీదు గీతము, బలాఢ్యులు,
          జనసంఖ్య — 14 అధ్యాయములు, ఒక్కొక్క అధ్యాయమునకు 30 ప్రశ్నలు.</p>
        <p class="meta">420 ప్రశ్నలు · అధ్యాయము వారీ నావిగేషన్ · జవాబు చూపు సౌకర్యము</p>
        <div class="center"><button class="btn" id="startBtn">మొదలుపెట్టు</button></div>
      </section>

      <section id="quiz" class="hidden">
        <div class="top">
          <span class="counter" id="counter">1 / 420</span>
          <div class="track">
            <div class="fill" id="fill"></div>
          </div>
          <select id="chapSel" aria-label="అధ్యాయము"></select>
          <span class="scorepill" id="scorepill">✦ 0</span>
        </div>
        <p class="qtag" id="qtag"></p>
        <h2 class="qtext" id="qtext"></h2>
        <div class="answer">
          <input type="text" id="input" placeholder="ఇక్కడ జవాబు రాయండి…" autocomplete="off" autocapitalize="off"
            spellcheck="false">
          <button class="btn" id="submitBtn" disabled>సమర్పించు</button>
        </div>
        <div class="actions">
          <button class="btn ghost" id="showBtn">జవాబు చూపించు</button>
        </div>
        <div class="verdict" id="verdict"></div>
        <div class="model hidden" id="model"></div>
        <div class="scripture hidden" id="scripture"></div>
        <div class="foot">
          <button class="btn ghost" id="prevBtn">← మునుపటి</button>
          <div class="right">
            <button class="btn ghost hidden" id="markBtn">నా జవాబు సరైనది ✓</button>
            <button class="btn" id="nextBtn">తరువాత →</button>
          </div>
        </div>
      </section>

      <section id="result" class="hidden">
        <p class="eyebrow">ఫలితము</p>
        <div class="score-num" id="scoreNum">0</div>
        <p class="score-of">420 లో <span id="scoreDen">0</span></p>
        <div class="rule"></div>
        <p class="verse" id="verse"></p>
        <div class="center"><button class="btn" id="againBtn">మళ్లీ ఆడు</button></div>
      </section>

    </div>
  </div>

  <script>
    const V = {
      "11:1": "వసంతకాలమున రాజులు యుద్ధమునకు బయలుదేరు సమయమున దావీదు యోవాబును అతనివారిని ఇశ్రాయేలీయులనందరిని పంపగా వారు అమ్మోనీయులను సంహరించి రబ్బా పట్టణమును ముట్టడివేసిరి; అయితే దావీదు యెరూషలేమునందు నిలిచెను.",
      "11:2": "ఒకానొక దినమున ప్రొద్దు గ్రుంకువేళ దావీదు పడకమీదనుండి లేచి రాజనగరి మిద్దెమీద నడుచుచు పైనుండి చూచుచుండగా స్నానముచేయు ఒక స్త్రీ కనబడెను.",
      "11:3": "ఆమె బహు సౌందర్యవతియై యుండుట చూచి దావీదు దాని సమాచారము తెలిసికొనుటకై యొక దూతను పంపెను, అతడు వచ్చి ఆమె ఏలీయాము కుమార్తెయు హిత్తీయుడగు ఊరియాకు భార్యయునైన బత్షెబ అని తెలియజేయగా",
      "11:4": "దావీదు దూతలచేత ఆమెను పిలువనంపెను. ఆమె అతని యొద్దకు రాగా అతడు ఆమెతో శయనించెను; కలిగిన అపవిత్రత పోగొట్టుకొని ఆమె తన యింటికి మరల వచ్చెను.",
      "11:5": "ఆ స్త్రీ గర్భవతియై నేను గర్భవతినైతినని దావీదునకు వర్తమానము పంపగా",
      "11:6": "దావీదు హిత్తీయుడగు ఊరియాను నాయొద్దకు పంపుమని దూత ద్వారా యోవాబునకు ఆజ్ఞ ఇచ్చెను.",
      "11:7": "ఊరియా దావీదు నొద్దకు రాగా దావీదు యోవాబు యోగక్షేమమును జనుల యోగక్షేమమును యుద్ధసమాచారమును అడిగెను.",
      "11:8": "తరువాత దావీదు ఇంటికి పోయి శ్రమ తీర్చుకొనుమని ఊరియాకు సెలవియ్యగా, ఊరియా రాజనగరిలోనుండి బయలువెళ్లెను.",
      "11:9": "అతని వెనుక రాజు ఫలాహారము అతనియొద్దకు పంపించెను గాని ఊరియా తన యింటికి వెళ్లక తన యేలినవాని సేవకులతో కూడ రాజనగరి ద్వారమున పండుకొనెను.",
      "11:11": "ఊరియా — మందసమును ఇశ్రాయేలు వారును యూదావారును గుడారములలో నివసించుచుండగను, నా యధిపతియగు యోవాబును నా యేలినవాడవగు నీ సేవకులును బయట దండులో నుండగను, భోజనపానములు చేయుటకును నా భార్యయొద్ద పరుండుటకును నేను ఇంటికిపోదునా? నీ తోడు నీ ప్రాణముతోడు నేనాలాగు చేయువాడను కానని దావీదుతో అనెను.",
      "11:12": "దావీదు — నేడును నీ విక్కడ నుండుము, రేపు నీకు సెలవిత్తునని ఊరియాతో అనగా ఊరియా నాడును మరునాడును యెరూషలేములో నిలిచెను.",
      "11:13": "అంతలో దావీదు అతనిని భోజనమునకు పిలిపించెను; అతడు బాగుగా తిని త్రాగిన తరువాత దావీదు అతని మత్తునిగా చేసెను; సాయంత్రమున అతడు బయలువెళ్లి తన యింటికి పోక తన యేలినవాని సేవకుల మధ్య పడకమీద పండుకొనెను.",
      "11:14": "ఉదయమున దావీదు యుద్ధము మోపుగా జరుగుచున్నచోట ఊరియాను ముందుపెట్టి అతడు కొట్టబడి హతమగునట్లు నీవు అతని యొద్దనుండి వెళ్లి పొమ్మని",
      "11:15": "యోవాబునకు ఉత్తరము వ్రాయించి ఊరియాచేత పంపించెను.",
      "11:16": "యోవాబు పట్టణమును ముట్టడివేయుచుండగా, ధైర్యవంతులుండు స్థలమును గుర్తించి ఆ స్థలమునకు ఊరియాను పంపెను.",
      "11:17": "ఆ పట్టణపువారు బయలుదేరి యోవాబుతో యుద్ధమునకు రాగా దావీదు సేవకులలో కొందరు కూలిరి, హిత్తీయుడగు ఊరియాయును హతమాయెను.",
      "11:21": "ఎరుబ్బెషెతు కుమారుడైన అబీమెలెకు ఏలాగు హతమాయెను? ఒక స్త్రీ తిరుగటిరాతి తునక ఎత్తి గోడమీదనుండి అతని మీద వేసినందున అతడు తేబేసు దగ్గర హతమాయెను గదా? ప్రాకారము దగ్గరకు మీరెందుకు పోతిరని నిన్నడిగినయెడల నీవు తమరి సేవకుడగు ఊరియాయు హతమాయెనని చెప్పుమని బోధించి దూతను పంపెను.",
      "11:25": "అందుకు దావీదు — నీవు యోవాబుతో ఈ మాట చెప్పుము: ఆ సంగతినిబట్టి నీవు చింతపడకుము; ఖడ్గము ఒకప్పుడు ఒకనిమీదను ఒకప్పుడు మరియొకనిమీదను పడుట కద్దు; పట్టణముమీద యుద్ధము మరి బలముగా జరిపి దానిని పడగొట్టుమని చెప్పి, నీవు యోవాబును ధైర్యపరచి చెప్పుమని ఆ దూతకు ఆజ్ఞ ఇచ్చి పంపెను.",
      "11:26": "ఊరియా భార్య తన భర్తయగు ఊరియా హతమైన సంగతి విని తన భర్తకొరకు అంగలార్చెను.",
      "11:27": "అంగలార్పుకాలము తీరిన తరువాత దావీదు దూతలను పంపి ఆమెను తన నగరికి తెప్పించుకొనగా ఆమె అతనికి భార్యయయి అతనికొక కుమారుని కనెను. అయితే దావీదు చేసినది యెహోవా దృష్టికి దుష్కార్యముగా ఉండెను.",
      "12:1": "కావున యెహోవా నాతానును దావీదునొద్దకు పంపెను; అతడు వచ్చి దావీదుతో ఇట్లనెను — ఒకానొక పట్టణమందు ఇద్దరు మనుష్యులు ఉండిరి.",
      "12:2": "ఒకడు ఐశ్వర్యవంతుడు ఒకడు దరిద్రుడు. ఐశ్వర్యవంతునికి విస్తారమైన గొఱ్ఱలును గొడ్లును కలిగియుండెను.",
      "12:3": "అయితే ఆ దరిద్రునికి తాను కొనుక్కొనిన యొక చిన్న ఆడు గొఱ్ఱపిల్ల తప్ప ఏమియు లేకపోయెను. వాడు దానిని పెంచుకొనుచుండగా అది వానియొద్దను వాని బిడ్డలయొద్దను ఉండి పెరిగి వాని చేతిముద్దలు తినుచు వాని గిన్నెలోనిది త్రాగుచు వాని కౌగిట పండుకొనుచు వానికి కుమార్తెవలె ఉండెను.",
      "12:4": "అట్లుండగా మార్గస్థుడొకడు ఐశ్వర్యవంతుని యొద్దకు వచ్చెను. అతడు తనయొద్దకు వచ్చిన మార్గస్థునికి ఆయత్తము చేయుటకు తన గొఱ్ఱలలోగాని గొడ్లలోగాని దేనిని ముట్టనొల్లక, ఆ దరిద్రుని గొఱ్ఱపిల్లను పట్టుకొని, తన యొద్దకు వచ్చినవానికి ఆయత్తము చేసెను.",
      "12:5": "దావీదు ఈ మాట విని ఆ మనుష్యునిమీద బహుగా కోపించుకొని — యెహోవా జీవముతోడు నిశ్చయముగా ఈ కార్యము చేసినవాడు మరణపాత్రుడు.",
      "12:6": "వాడు కనికరము లేక యీ కార్యము చేసెను గనుక ఆ గొఱ్ఱపిల్లకు ప్రతిగా నాలుగు గొఱ్ఱపిల్లల నియ్యవలెనని నాతానుతో అనెను.",
      "12:7": "నాతాను దావీదును చూచి — ఆ మనుష్యుడవు నీవే. ఇశ్రాయేలీయుల దేవుడైన యెహోవా సెలవిచ్చునదేమనగా — ఇశ్రాయేలీయులమీద నేను నిన్ను రాజుగా పట్టాభిషేకముచేసి సౌలు చేతిలోనుండి నిన్ను విడిపించి నీ యజమానుని నగరిని నీకనుగ్రహించి",
      "12:9": "నీవు యెహోవా మాటను తృణీకరించి ఆయన దృష్టికి చెడుతనము చేసితివేమి? హిత్తీయుడగు ఊరియాను కత్తిచేత చంపించి అతని భార్యను నీకు భార్య యగునట్లుగా నీవు పట్టుకొని యున్నావు; అమ్మోనీయులచేత నీవతని చంపించితివి గదా?",
      "12:10": "నీవు నన్ను లక్ష్యము చేయక హిత్తీయుడగు ఊరియా భార్యను నీకు భార్య యగునట్లు తీసికొనినందున నీ యింటివారికి సదాకాలము యుద్ధము కలుగును.",
      "12:11": "నా మాట ఆలకించుము; యెహోవానగు నేను సెలవిచ్చునదేమనగా — నీ యింటివారి మూలముననే నేను నీకు అపాయము పుట్టింతును; నీవు చూచుచుండగా నేను నీ భార్యలను తీసి నీ చేరువ వానికప్పగించెదను.",
      "12:12": "పగటియందు వాడు వారితో శయనించును. నీవు ఈ కార్యము రహస్యముగా చేసితివిగాని ఇశ్రాయేలీయులందరు చూచుచుండగా పగటియందే నేను చెప్పినదానిని చేయింతును అనెను.",
      "12:13": "నేను పాపముచేసితినని దావీదు నాతానుతో అనగా నాతాను — నీవు చావకుండునట్లు యెహోవా నీ పాపమును పరిహరించెను.",
      "12:14": "అయితే ఈ కార్యమువలన యెహోవాను దూషించుటకు ఆయన శత్రువులకు నీవు గొప్ప హేతువు కలుగజేసితివి",
      "12:16": "దావీదు ఉపవాసముండి లోపలికి పోయి రాత్రి అంతయు నేలపడియుండి బిడ్డకొరకు దేవుని బతిమాలగా, ఇంటిలో ఎన్నికయైనవారు లేచి అతనిని నేలనుండి లేవనెత్తుటకు వచ్చిరిగాని అతడు సమ్మతింపక వారితోకూడ భోజనము చేయకయుండెను.",
      "12:18": "ఏడవ దినమున బిడ్డ చావగా — బిడ్డ ప్రాణముతో ఉండగా మేము అతనితో మాటలాడినప్పుడు అతడు మా మాటలు వినకయుండెను.",
      "12:19": "అయితే దావీదు తన సేవకులు గుసగుసలాడుట చూచి బిడ్డ చనిపోయెనను సంగతి గ్రహించి — బిడ్డ చనిపోయెనా అని తన సేవకుల నడుగగా వారు చనిపోయెననిరి.",
      "12:20": "అప్పుడు దావీదు నేలనుండి లేచి స్నానముచేసి తైలము పూసికొని వేరు వస్త్రములు ధరించి యెహోవా మందిరములో ప్రవేశించి మ్రొక్కి తన యింటికి తిరిగి వచ్చి భోజనము తెమ్మనగా వారు వడ్డించిరి; అప్పుడు అతడు భోజనము చేసెను.",
      "12:23": "ఇప్పుడు చనిపోయెను గనుక నేనెందుకు ఉపవాసముండవలెను? వానిని తిరిగి రప్పించగలనా? నేను వానియొద్దకు పోవుదును గాని వాడు నాయొద్దకు మరల రాడని వారితో చెప్పెను.",
      "12:24": "తరువాత దావీదు తన భార్యయైన బత్షెబను ఓదార్చి ఆమెయొద్దకు పోయి ఆమెను కూడగా ఆమె యొక కుమారుని కనెను. దావీదు అతనికి సొలొమోను అని పేరు పెట్టెను.",
      "12:25": "యెహోవా అతనిని ప్రేమించి నాతాను అను ప్రవక్తను పంపగా అతడు యెహోవా ఆజ్ఞనుబట్టి యదీద్యా అని అతనికి పేరు పెట్టెను.",
      "12:26": "యోవాబు రబ్బా అను అమ్మోనీయుల పట్టణముమీద యుద్ధము చేసి రాజనగరిని పట్టుకొనెను.",
      "12:27": "దావీదునొద్దకు అతడు దూతలను పంపి — నేను రబ్బామీద యుద్ధముచేసి జలములమీది పట్టణమును పట్టుకొంటిని;",
      "12:28": "నేను పట్టణమును పట్టుకొని నా పేరు దానికి పెట్టకుండునట్లు మిగిలిన దండువారిని సమకూర్చి నీవు పట్టణమును పట్టుకొనవలెనని వర్తమానము చేయగా",
      "12:29": "దావీదు యోధులను సమకూర్చి రబ్బాకు వచ్చి దానిమీద యుద్ధముచేసి దానిని పట్టుకొని, వారి రాజు కిరీటమును అతని తలమీదనుండి తీయించగా అది దావీదు తలమీద పెట్టబడెను. అది విలువగల రత్నములు చెక్కినదై రెండు బంగారు మనుగులంత యెత్తుండెను.",
      "12:31": "పట్టణములో ఉన్నవారిని బయటికి తెప్పించి రంపములచేతను పదునుగల యినుప పనిముట్లచేతను ఇనుప గొడ్డండ్లచేతను వారిని తుత్తునియలుగా చేయించి వారిని ఇటుక ఆవములో వేసెను. అమ్మోనీయుల పట్టణములన్నిటికి అతడు ఈలాగు చేసెను. ఆ తరువాత దావీదును జనులందరును తిరిగి యెరూషలేమునకు వచ్చిరి.",
      "13:1": "తరువాత దావీదు కుమారుడగు అబ్షాలోమునకు తామారను నొక సుందరవతియగు సహోదరియుండగా దావీదు కుమారుడగు అమ్నోను ఆమెను మోహించెను.",
      "13:2": "తామారు కన్యయైనందున ఆమెకు ఏమి చేయవలెనన్నను దుర్లభమని అమ్నోను గ్రహించి చింతాక్రాంతుడై తన చెల్లెలైన తామారునుబట్టి చిక్కిపోయెను.",
      "13:3": "అమ్నోనునకు మిత్రుడొకడుండెను. అతడు దావీదు సహోదరుడైన షిమ్యా కుమారుడు, అతని పేరు యెహోనాదాబు. ఈ యెహోనాదాబు బహు కపటముగలవాడు.",
      "13:5": "యెహోనాదాబు — నీవు రోగివైనట్టు వేషము వేసికొని నీ మంచముమీద పండుకొనియుండుము. నీ తండ్రి నిన్ను చూచుటకు వచ్చినప్పుడు నీవు — నా చెల్లెలైన తామారుచేత సిద్ధపరచబడిన భోజనము నేను భుజించునట్లు ఆమె వచ్చి నేను చూచుచుండగా దానిని సిద్ధము చేసి నాకు పెట్టునట్లు సెలవిమ్మని అడుగుమని అతనికి బోధింపగా అమ్నోను పడకమీద పండుకొనెను.",
      "13:6": "అమ్నోను కాయిలాపడెనని రాజు అతని చూడ వచ్చినప్పుడు అమ్నోను — నా చెల్లెలగు తామారు చేతి వంటకము నేను భుజించునట్లు ఆమె వచ్చి నేను చూచుచుండగా నాకొరకు రెండు అప్పములు చేయుటకు సెలవిమ్మని రాజుతో మనవి చేయగా",
      "13:8": "కాబట్టి తామారు తన అన్నయగు అమ్నోను ఇంటికి పోయెను.",
      "13:9": "అతడు పండుకొనియుండగా ఆమె పిండితీసికొని కలిపి అతని యెదుట అప్పములు చేసి వాటిని కాల్చి బొరుసు పట్టుకొని అతనికి వడ్డింపగా అతడు నాకు వద్దని చెప్పి ఉన్నవారందరు నాయొద్దనుండి అవతలకు పొండనెను.",
      "13:10": "వారందరు బయటికి పోయిన తరువాత అమ్నోను — నీచేతి వంటకము నేను భుజించునట్లు దానిని గదిలోనికి తెమ్మనగా, తామారు తాను చేసిన అప్పములను తీసికొని గదిలోపలనున్న తన అన్నయగు అమ్నోను నొద్దకు వచ్చెను.",
      "13:11": "అయితే అతడు భుజింపవలెనని ఆమె వాటిని తీసికొనివచ్చినప్పుడు అతడు ఆమెను పట్టుకొని — నా చెల్లీ రమ్ము, నాతో శయనించుము అని చెప్పగా",
      "13:12": "ఆమె — నా అన్నా, నన్ను అవమానపరచకుము; ఈలాగు చేయుట ఇశ్రాయేలీయులకు తగదు, ఇట్టి జారకార్యము నీవు చేయవద్దు, నా యవమానము నేనెక్కడ దాచుకొందును?",
      "13:13": "నీవును ఇశ్రాయేలీయులలో దుర్మార్గుడవగుదువు; అయితే ఇందునుగూర్చి రాజుతో మాటలాడుము;",
      "13:14": "అతడు నన్ను నీకియ్యకపోడు అని చెప్పినను అతడు ఆమె మాట వినక ఆమెను బలవంతముచేసి అవమానపరచి ఆమెతో శయనించెను.",
      "13:15": "అమ్నోను ఈలాగు చేసిన తరువాత ఆమెయెడల అత్యధికమైన ద్వేషము పుట్టి అదివరకు ఆమెను ప్రేమించినంతకంటె అతడు మరి యెక్కువగా ఆమెను ద్వేషించి లేచి పొమ్మని ఆమెతో చెప్పగా",
      "13:17": "అతడు ఆమె మాట వినక తన పనివారిలో ఒకని పిలిచి — దీనిని నాయొద్దనుండి వెళ్లగొట్టి తలుపు గడియ వేయుమని చెప్పెను.",
      "13:18": "కన్యకలైన రాజకుమార్తెలు వివిధ వర్ణములుగల చీరలు ధరించువారు. ఆమె యట్టి చీరయొకటి ధరించియుండెను. పనివాడు ఆమెను బయటికి వెళ్లగొట్టి మరల రాకుండునట్లు తలుపు గడియవేసెను.",
      "13:19": "అప్పుడు తామారు నెత్తిమీద బుగ్గిపోసికొని తాను కట్టుకొనిన వివిధ వర్ణములుగల చీరను చింపి నెత్తిమీద చెయ్యిపెట్టుకొని యేడ్చుచు పోగా",
      "13:20": "ఆమె అన్నయగు అబ్షాలోము ఆమెను చూచి — నీ అన్నయగు అమ్నోను నిన్ను కూడినాడు గదా? నా చెల్లీ నీవు ఊరకుండుము; అతడు నీ అన్నే గదా, యిందునుగూర్చి చింతపడవద్దనెను. కావున తామారు చెరుపబడినదై తన అన్నయగు అబ్షాలోము ఇంట నుండెను.",
      "13:21": "ఈ సంగతి రాజగు దావీదునకు వినబడినప్పుడు అతడు బహురౌద్రము తెచ్చుకొనెను.",
      "13:22": "అబ్షాలోము తన అన్నయగు అమ్నోనుతో మంచి చెడ్డ లేమియు మాటలాడక ఊరకుండెను గాని, తన సహోదరియగు తామారును బలవంతము చేసినందుకై అతనిమీద పగయుంచెను.",
      "13:23": "రెండు సంవత్సరములైన తరువాత ఎఫ్రాయిమునకు సమీపమందుండు బయల్దాసోరులో అబ్షాలోము గొఱ్ఱల బొచ్చు కత్తిరించు కాలము రాగా అబ్షాలోము రాజకుమారులనందరిని విందునకు పిలిచెను.",
      "13:28": "అంతలో అబ్షాలోము తన పనివారిని పిలిచి, అమ్నోను ద్రాక్షారసమువలన సంతోషియై యుండుట మీరు కనిపెట్టియుండి అమ్నోనును హతము చేయుడని నేను మీతో చెప్పునప్పుడు భయపడక అతని చంపుడి, నేను గదా మీకు ఆజ్ఞ ఇచ్చియున్నాను, ధైర్యము తెచ్చుకొని పౌరుషము చూపుడి అని గట్టిగా ఆజ్ఞ ఇచ్చెను.",
      "13:29": "అబ్షాలోము ఇచ్చిన ఆజ్ఞచొప్పున వారు చేయగా రాజకుమారులందరును లేచి తమ కంచరగాడిదల నెక్కి పారిపోయిరి.",
      "13:32": "దావీదు సహోదరుడైన షిమ్యాకు పుట్టిన యెహోనాదాబు దీనిని చూచి — రాజకుమారులైన యౌవనులనందరిని వారు చంపిరని నా యేలినవాడవగు నీవు తలంచవద్దు; అమ్నోను మాత్రమే మరణమాయెను; ఏలయనగా అతడు అబ్షాలోము చెల్లెలైన తామారును బలవంతము చేసిననాటనుండి అబ్షాలోము అతని చంపవలెనను తాత్పర్యముతో ఉండెనని అతని నోటి మాటనుబట్టి నిశ్చయించుకొనవచ్చును.",
      "13:37-38": "అయితే అబ్షాలోము పారిపోయి అమీహూదు కుమారుడైన తల్మయి అను గెషూరు రాజునొద్ద చేరెను. దావీదు అనుదినమును తన కుమారునికొరకు అంగలార్చుచుండెను. అబ్షాలోము పారిపోయి గెషూరునకు వచ్చి అక్కడ మూడు సంవత్సరములుండెను.",
      "14:1": "రాజు అబ్షాలోముమీద ప్రాణము పెట్టుకొని యున్నాడని సెరూయా కుమారుడైన యోవాబు గ్రహించి",
      "14:2": "తెకోవనుండి యుక్తిగల యొక స్త్రీని పిలువనంపించి — ఏడ్చుచున్న దానవైనట్టు నటించి దుఃఖవస్త్రములు ధరించుకొని తైలము పూసికొనక బహు కాలము దుఃఖపడిన దానివలెనుండి",
      "14:4": "కాగా తెకోవ ఊరి స్త్రీ రాజునొద్దకు వచ్చి సాగిలపడి నమస్కారము చేసి — రాజా రక్షించుమనగా",
      "14:5": "రాజు — నీకేమి కష్టము వచ్చెనని అడిగెను. అందుకు ఆమె — నేను నిజముగా విధవరాలను, నా పెనిమిటి చనిపోయెను;",
      "14:6": "నీ దాసినైన నాకు ఇద్దరు కుమారులు ఉండిరి, వారు పొలములో పెనుగులాడుచుండగా విడిపించువాడెవడును లేకపోయినందున వారిలో నొకడు రెండవవాని కొట్టి చంపెను.",
      "14:7": "కాబట్టి నా యింటివారందరును నీ దాసినైన నామీదికి లేచి — తన సహోదరుని చంపినవాని అప్పగించుము; తన సహోదరుని ప్రాణము తీసినందుకై మేము వానిని చంపి హక్కుదారుని నాశనము చేతుమనుచున్నారు. ఈలాగున వారు నా పెనిమిటికి భూమిమీద పేరైనను శేషమైనను లేకుండ మిగిలిన నిప్పురవను ఆర్పివేయబోవుచున్నారని రాజుతో చెప్పగా",
      "14:11": "అప్పుడు ఆమె — రాజవైన నీవు నీ దేవుడైన యెహోవాను స్మరించి హత్యకు ప్రతిహత్య చేయువారు నా కుమారుని నశింపజేయకుండ ఇకను నాశనము చేయుట మాన్పించుమని మనవిచేయగా రాజు — యెహోవా జీవముతోడు నీ కుమారుని తల వెండ్రుకలలో ఒకటైనను నేల రాలకుండుననెను.",
      "14:13": "అందుకు ఆ స్త్రీ — దేవుని జనులైనవారికి విరోధముగా నీవెందుకు దీనిని తలపెట్టియున్నావు? రాజు ఆ మాట సెలవిచ్చుటచేత తాను వెళ్లగొట్టిన తనవాని రానియ్యక తానే దోషియగుచున్నాడు.",
      "14:14": "మనమందరమును చనిపోదుము గదా, నేలను ఒలికిన మీదట మరల ఎత్తలేని నీటివలె ఉన్నాము; దేవుడు ప్రాణముతీయక తోలివేయబడినవాడు తనకు దూరస్థుడు కాకయుండుటకు సాధనములు కల్పించుచున్నాడు.",
      "14:17": "మరియు నీ దేవుడైన యెహోవా నీకు తోడై యున్నాడు గనుక నా యేలినవాడవును రాజవునగు నీవు దేవుని దూతవంటివాడవై మంచి చెడ్డలన్నియు విచారింప చాలియున్నావు; కాబట్టి నీ దాసినగు నేను నా యేలినవాడగు రాజు సెలవిచ్చిన మాట సమాధానకరమగునని అనుకొంటిననెను.",
      "14:19": "అంతట రాజు — యోవాబు నీకు బోధించెనా అని ఆమె నడిగినందుకు ఆమె యిట్లనెను — నా యేలినవాడవైన రాజా, నీ ప్రాణముతోడు, చెప్పినదానిని తప్పక గ్రహించుటకు నా యేలినవాడవును రాజవునగు నీవంటివాడొకడును లేడు; నీ సేవకుడగు యోవాబు నాకు బోధించి యీ మాటలన్నిటిని నీ దాసినగు నాకు నేర్పెను.",
      "14:21": "అప్పుడు రాజు యోవాబుతో ఈలాగున సెలవిచ్చెను — ఆలకించుము, నీవు మనవి చేసినదానిని నేను ఒప్పుకొనుచున్నాను.",
      "14:23": "యోవాబు లేచి గెషూరునకు పోయి అబ్షాలోమును యెరూషలేమునకు తోడుకొని వచ్చెను.",
      "14:24": "అయితే రాజు — అతడు నా దర్శనము చేయక తన ఇంటికి పోవలెనని ఉత్తరవు చేయగా అబ్షాలోము రాజదర్శనము చేయక తన ఇంటికి పోయెను.",
      "14:25": "ఇశ్రాయేలీయులందరిలో అబ్షాలోమంత సౌందర్యము గలవాడు ఒకడును లేడు; అరికాలు మొదలుకొని తలవరకు ఏ లోపమును అతనియందు లేకపోయెను.",
      "14:26": "తన తల వెండ్రుకలు భారముగా నున్నందున ఏటేట అతడు వాటిని కత్తిరించుచు వచ్చెను; కత్తిరించునప్పుడెల్ల వాటి యెత్తు రాజు తూనికనుబట్టి రెండువందల తులములాయెను.",
      "14:27": "అబ్షాలోమునకు ముగ్గురు కుమారులును తామారు అనునొక కుమార్తెయు పుట్టిరి; ఆమె బహు సౌందర్యవతి.",
      "14:28": "అబ్షాలోము రెండు నిండు సంవత్సరములు యెరూషలేములోనుండియు రాజదర్శనము చేయకయుండగా",
      "14:29": "యోవాబును రాజునొద్దకు పంపించుటకై అబ్షాలోము అతనిని పిలువనంపినప్పుడు యోవాబు రానొల్లకయుండెను. రెండవమారు అతని పిలువనంపినప్పుడు అతడు రానొల్లక పోగా",
      "14:30": "అబ్షాలోము తన పనివారిని పిలిచి — యోవాబు పొలము నా పొలముదగ్గర నున్నది గదా, దానిలో యవల చేలు ఉన్నవి; మీరు పోయి వాటిని తగులబెట్టుడని వారితో చెప్పెను. అబ్షాలోము పనివారు ఆ చేలు తగులబెట్టగా",
      "14:32": "అబ్షాలోము యోవాబుతో ఇట్లనెను — గెషూరునుండి నేను వచ్చిన ఫలమేమి? నేనచ్చటనే యుండుట మేలని నీద్వారా రాజుతో చెప్పుకొనుటకై రాజునొద్దకు నిన్ను పంపవలెనని నేను నిన్ను పిలిచితిని; రాజదర్శనము నేను చేయవలెను; నాయందు దోషము కనబడినయెడల రాజు నాకు మరణశిక్ష విధింపవచ్చును.",
      "14:33": "అంతట యోవాబు రాజునొద్దకు వచ్చి ఆ సమాచారము తెలుపగా, రాజు అబ్షాలోమును పిలువనంపించెను. అతడు రాజునొద్దకు వచ్చి రాజసన్నిధిని సాష్టాంగ నమస్కారము చేయగా రాజు అబ్షాలోమును ముద్దుపెట్టుకొనెను.",
      "15:1": "ఇదియైన తరువాత అబ్షాలోము ఒక రథమును గుఱ్ఱములను సిద్ధపరచి, తనయెదుట పరుగెత్తుటకై యేబదిమంది బంటులను ఏర్పరచుకొనెను.",
      "15:2": "ఉదయముననే లేచి బయలుదేరి పట్టణముయొక్క గుమ్మపు మార్గమందు ఒక తట్టున నిలిచి, రాజుచేత తీర్పునొందుటకై వ్యాజ్యెమాడువారెవరైనను వచ్చియుండగా కనిపెట్టి వారిని పిలిచి — నీవు ఏ ఊరివాడవని యడుగుచుండెను.",
      "15:3": "అబ్షాలోము — నీ వ్యాజ్యెము సరిగాను న్యాయముగాను ఉన్నదిగాని దానిని విచారించుటకై నియమింపబడినవాడు రాజునొద్ద ఒకడును లేడని చెప్పి",
      "15:4": "నేను ఈ దేశమునకు న్యాయాధిపతినైయుండుట యెంత మేలు; అప్పుడు వ్యాజ్యెమాడువారు నాయొద్దకు వత్తురు, నేను వారికి న్యాయము తీర్చుదునని చెప్పుచు వచ్చెను.",
      "15:5": "మరియు తనకు నమస్కారము చేయుటకై యెవడైనను తన దాపునకు వచ్చినప్పుడు అతడు తన చేయి చాపి అతని పట్టుకొని ముద్దుపెట్టుకొనుచు వచ్చెను.",
      "15:6": "తీర్పునొందుటకై రాజునొద్దకు వచ్చిన ఇశ్రాయేలీయులకందరికి అబ్షాలోము ఈ ప్రకారము చేసి ఇశ్రాయేలీయులనందరిని తనతట్టు త్రిప్పుకొనెను.",
      "15:7": "నాలుగు సంవత్సరములు జరిగినమీదట అబ్షాలోము రాజునొద్దకు వచ్చి — నీ దాసుడనైన నేను సిరియ దేశమునందలి గెషూరునందుండగా యెహోవా నన్ను యెరూషలేమునకు తిరిగి రప్పించినయెడల నేను ఆయనను సేవించెదనని మ్రొక్కుకొంటిని గనుక,",
      "15:8": "నేను హెబ్రోనునకు పోయి యెహోవాకు నేను మ్రొక్కుకొనిన మ్రొక్కుబడి తీర్చుకొనుటకు నాకు సెలవిమ్మని మనవిచేయగా",
      "15:10": "అబ్షాలోము — మీరు బాకానాదము వినునప్పుడు అబ్షాలోము హెబ్రోనులో ఏలుచున్నాడని కేకలు వేయుడని చెప్పుటకై ఇశ్రాయేలీయుల గోత్రములన్నిటియొద్దకు వేగులవారిని పంపెను.",
      "15:11": "విందునకు పిలువబడియుండి రెండువందల మంది యెరూషలేములోనుండి అబ్షాలోముతో కూడ బయలుదేరియుండిరి, వీరు ఏమియు తెలియక యథార్థమైన మనస్సుతో వెళ్లియుండిరి.",
      "15:12": "మరియు బలి అర్పింపవలెనని యుండి అబ్షాలోము గీలోనీయుడైన అహీతోపెలు అను దావీదుయొక్క మంత్రిని గీలో అను అతని ఊరినుండి పిలిపించియుండెను. అబ్షాలోము దగ్గరకు వచ్చిన జనము మరి మరి యెక్కువగుటచేత కుట్ర బహు బలమాయెను.",
      "15:14": "దావీదు యెరూషలేమునందున్న తన సేవకులకందరికి ఈలాగు ఆజ్ఞ ఇచ్చెను — అబ్షాలోము చేతిలోనుండి మనము తప్పించుకొని రక్షణ నొందలేము; మనము పారిపోదము రండి, అతడు హఠాత్తుగా వచ్చి మనలను పట్టుకొనకను, మనకు కీడుచేయకను, పట్టణమును కత్తివాత హతము చేయకను ఉండునట్లు మనము త్వరగా వెళ్లిపోదము రండి.",
      "15:16": "అప్పుడు రాజు నగరిని కనిపెట్టుటకై ఉపపత్నులగు పదిమందిని ఉంచిన మీదట తన యింటివారినందరిని వెంటబెట్టుకొని కాలినడకను బయలుదేరెను.",
      "15:18": "అతని సేవకులందరును అతని యిరుపార్శ్వముల నడిచిరి; కెరేతీయులందరును పెలేతీయులందరును గాతునుండి వచ్చిన ఆరువందల మంది గిత్తీయులును రాజునకు ముందుగా నడచుచుండిరి.",
      "15:19": "రాజు గిత్తీయుడగు ఇత్తయిని కనుగొని — నీవు నివాసస్థలము కోరు పరదేశివై యున్నావు; నీవెందుకు మాతో కూడ వచ్చుచున్నావు? నీవు తిరిగి పోయి రాజున్న స్థలమున ఉండుము.",
      "15:21": "ఇత్తయి — నేను చచ్చినను బ్రదికినను, యెహోవా జీవముతోడు నా యేలినవాడవును రాజవునగు నీ జీవముతోడు, ఏ స్థలమందు నా యేలినవాడవును రాజవునగు నీవుందువో ఆ స్థలమందే నీ దాసుడనైన నేనుందునని రాజుతో మనవిచేసెను.",
      "15:23": "వారు సాగిపోవుచుండగా జనులందరు బహుగా ఏడ్చుచుండిరి, ఈ ప్రకారము వారందరు రాజుతోకూడ కిద్రోను వాగు దాటి అరణ్యమార్గమున ప్రయాణమై పోయిరి.",
      "15:24": "సాదోకును లేవీయులందరును దేవుని నిబంధన మందసమును మోయుచు అతనియొద్ద ఉండిరి. వారు దేవుని మందసమును దింపగా అబ్యాతారు వచ్చి పట్టణములోనుండి జనులందరును దాటిపోవువరకు నిలిచెను.",
      "15:25": "అప్పుడు రాజు సాదోకును పిలిచి — దేవుని మందసమును పట్టణములోనికి తిరిగి తీసికొనిపొమ్ము; యెహోవా దృష్టికి నేను అనుగ్రహము పొందినయెడల ఆయన నన్ను తిరిగి రప్పించి",
      "15:27": "యాజకుడైన సాదోకుతో ఇట్లనెను — సాదోకూ, నీవు దీర్ఘదర్శివి కావా? శుభమొంది నీవును నీ కుమారుడగు అహిమయస్సు అబ్యాతారునకు పుట్టిన యోనాతాను అను మీ యిద్దరు కుమారులును పట్టణమునకు పోవలెను.",
      "15:28": "ఆలకించుము; నీయొద్దనుండి నాకు రూఢియైన వర్తమానము వచ్చువరకు నేను అరణ్యమందలి రేవులదగ్గర నిలిచియుందును.",
      "15:30": "అయితే దావీదు ఒలీవచెట్ల కొండ యెక్కుచు ఏడ్చుచు, తల కప్పుకొని పాదరక్షలులేకుండ కాలినడకను వెళ్లెను; అతనియొద్దనున్న జనులందరును తలలు కప్పుకొని యేడ్చుచు కొండ యెక్కిరి.",
      "15:31": "అంతలో ఒకడు వచ్చి, అబ్షాలోము చేసిన కుట్రలో అహీతోపెలు చేరియున్నాడని దావీదునకు తెలియజేయగా దావీదు — యెహోవా, అహీతోపెలుయొక్క ఆలోచనను చెడగొట్టుమని ప్రార్థన చేసెను.",
      "15:32": "దేవుని ఆరాధించు స్థలమొకటి ఆ కొండమీద ఉండెను. వారు అచ్చటికి రాగా అర్కీయుడైన హూషై పై వస్త్రములు చింపుకొని తలమీద ధూళి పోసికొని వచ్చి రాజును దర్శనము చేసెను.",
      "15:34": "నీవు పట్టణమునకు తిరిగి పోయి — రాజా, యింతవరకు నీ తండ్రికి నేను సేవచేసినట్లు ఇకను నీకు సేవచేసెదనని అబ్షాలోముతో చెప్పినయెడల నీవు నా పక్షపువాడవై యుండి అహీతోపెలుయొక్క ఆలోచనను చెడగొట్టగలవు.",
      "16:1": "దావీదు కొండ శిఖరము అవతల కొంచెము దూరము వెళ్లిన తరువాత మెఫీబోషెతు సేవకుడైన సీబా గంతలు కట్టిన రెండు గాడిదలను తీసికొని వచ్చెను; రెండువందల రొట్టెలును నూరు ద్రాక్ష గెలలును నూరు అంజూరపు అడలును ద్రాక్షారసపు తిత్తి ఒకటియు వాటిమీద వేసియుండెను.",
      "16:2": "రాజు — ఇవి ఎందుకు తెచ్చితివని సీబాను అడుగగా సీబా — గాడిదలు రాజు ఇంటివారు ఎక్కుటకును, రొట్టెలును అంజూరపు అడలును పనివారు తినుటకును, ద్రాక్షారసము అరణ్యమందు అలసటనొందినవారు త్రాగుటకును తెచ్చితిననగా",
      "16:3": "రాజు — నీ యజమానుని కుమారుడు ఎక్కడనున్నాడని అడిగెను. అందుకు సీబా — చిత్తగించుము, ఈవేళ ఇశ్రాయేలీయులు తన తండ్రి రాజ్యమును తనకు తిరిగి యిప్పింతురనుకొని అతడు యెరూషలేములో నిలిచియున్నాడనెను.",
      "16:4": "అందుకు రాజు — మెఫీబోషెతునకు కలిగినదంతయు నీదేయని సీబాతో చెప్పగా సీబా — నా యేలినవాడా రాజా, నీ దృష్టియందు నేను అనుగ్రహము పొందుదునుగాక, నేను నీకు నమస్కారము చేయుచున్నాననెను.",
      "16:5": "రాజైన దావీదు బహూరీము దాపునకు వచ్చినప్పుడు సౌలు కుటుంబికుడగు గెరా కుమారుడైన షిమీ అనునొకడు అచ్చటనుండి బయలుదేరి వచ్చెను; అతడు వెంట వెంట నడుచుచు దావీదును శపించుచు",
      "16:6": "జనులందరును బలాఢ్యులందరును దావీదు ఇరు పార్శ్వముల నుండగా రాజైన దావీదుమీదను అతని సేవకులందరిమీదను రాళ్లు రువ్వుచు వచ్చెను.",
      "16:7": "ఈ షిమీ — నరహంతకుడా, దుర్మార్గుడా",
      "16:8": "ఛీపో, ఛీపో, నీవేలవలెనని నీవు వెళ్లగొట్టిన సౌలు ఇంటివారి హత్యను యెహోవా నీ మీదికి రప్పించి, యెహోవా నీ కుమారుడైన అబ్షాలోము చేతికి రాజ్యమును అప్పగించియున్నాడు; నీవు నరహంతకుడవు గనుకనే నీ మోసములో నీవు చిక్కుబడియున్నావని చెప్పి రాజును శపింపగా",
      "16:9": "సెరూయా కుమారుడైన అబీషై — ఈ చచ్చిన కుక్క నా యేలినవాడవును రాజవునగు నిన్ను శపింపనేల? నీ చిత్తమైతే నేను వానిని చేరబోయి వాని తల ఛేదించి వచ్చెదననెను.",
      "16:10": "అందుకు రాజు — సెరూయా కుమారులారా, మీకును నాకును ఏమి పొందు? వానిని శపింపనియ్యుడు, దావీదును శపింపుమని యెహోవా వానికి సెలవియ్యగా నీవు ఈలాగున నెందుకు చేయుచున్నావని ఆక్షేపణ చేయగలవాడెవడని చెప్పి",
      "16:11": "అబీషైతోను తన సేవకులందరితోను పలికినదేమనగా — నా కడుపున బుట్టిన నా కుమారుడే నా ప్రాణము తీయచూచుచుండగా ఈ బెన్యామీనీయుడు ఈ ప్రకారము చేయుట ఏమి ఆశ్చర్యము? వానిజోలి మానుడి, యెహోవా వానికి సెలవిచ్చియున్నాడు గనుక వానిని శపింపనియ్యుడి.",
      "16:12": "యెహోవా నా శ్రమను లక్ష్యపెట్టునేమో, వాడు పలికిన శాపమునకు బదులుగా యెహోవా నాకు మేలు చేయునేమో.",
      "16:14": "రాజును అతనితోకూడనున్న జనులందరును బడలినవారై యొకానొక చోటికి వచ్చి అలసట తీర్చుకొనిరి.",
      "16:15": "అబ్షాలోమును ఇశ్రాయేలువారందరును అహీతోపెలును యెరూషలేమునకు వచ్చియుండిరి.",
      "16:16": "దావీదుతో స్నేహముగానున్న అర్కీయుడైన హూషైయను నతడు అబ్షాలోమునొద్దకు వచ్చి అతని దర్శించి — రాజు చిరంజీవియగును గాక రాజు చిరంజీవియగును గాక అని పలుకగా",
      "16:17": "అబ్షాలోము — నీ స్నేహితునికి నీవు చేయు ఉపకారమింతేనా? నీ స్నేహితునితో కూడ నీవు వెళ్లకపోతివేమని అతని నడుగగా",
      "16:18": "హూషై — యెహోవాయును ఈ జనులును ఇశ్రాయేలీయులందరును ఎవని కోరుకొందురో నేను అతనివాడనగుదును, అతనియొద్దనే యుందును.",
      "16:19": "మరియు నేనెవనికి సేవచేయవలెను? అతని కుమారుని సన్నిధిని నేను సేవచేయవలెను గదా? నీ తండ్రి సన్నిధిని నేను సేవచేసినట్లు నీ సన్నిధిని నేను సేవచేయుదునని అబ్షాలోమునొద్ద మనవి చేసెను.",
      "16:21": "అహీతోపెలు — నీ తండ్రిచేత ఇంటికి కావలి యుంచబడిన ఉపపత్నులయొద్దకు నీవు పోయినయెడల నీవు నీ తండ్రికి అసహ్యుడవైతివని ఇశ్రాయేలీయులందరు తెలిసికొందురు, అప్పుడు నీ పక్షమున నున్నవారందరు ధైర్యము తెచ్చుకొందురని చెప్పెను.",
      "16:22": "కాబట్టి మేడమీద వారు అబ్షాలోమునకు గుడారము వేయగా ఇశ్రాయేలీయులకందరికి తెలియునట్లుగా అతడు తన తండ్రి ఉపపత్నులను కూడెను.",
      "16:23": "ఆ దినములలో అహీతోపెలు చెప్పిన యే యాలోచనయైనను ఒకడు దేవునియొద్ద విచారణచేసి పొందిన ఆలోచనయైనట్టుగా ఉండెను; దావీదును అబ్షాలోమును దానిని అట్లే యెంచుచుండిరి.",
      "17:1": "అహీతోపెలు అబ్షాలోముతో ఇట్లనెను — నీ చిత్తమైతే నేను పండ్రెండు వేలమందిని ఏర్పరచుకొనిపోయి యీ రాత్రి దావీదును తరిమి పట్టుకొందును.",
      "17:2": "దావీదు అలసట నొంది బలహీనముగా నున్నాడు గనుక నేను అతనిమీద పడి అతని బెదరించినయెడల అతని యొద్దనున్న జనులందరు పారిపోదురు; రాజును మాత్రము హతముచేసి జనులందరిని నీతట్టు త్రిప్పెదను;",
      "17:4": "ఈ బోధ అబ్షాలోమునకును ఇశ్రాయేలువారి పెద్దలకందరికిని యుక్తముగా కనబడెను.",
      "17:5": "అంతట అర్కీయుడైన హూషై యేమి చెప్పునో మనము వినునట్లు అతని పిలువనంపుడని అబ్షాలోము ఆజ్ఞ ఇయ్యగా, హూషై అబ్షాలోమునొద్దకు వచ్చెను.",
      "17:7": "హూషై అబ్షాలోముతో ఇట్లనెను — ఈసారి అహీతోపెలు చెప్పిన ఆలోచన మంచిది కాదు.",
      "17:8": "నీ తండ్రియు అతని పక్షమున నున్నవారును మహా బలాఢ్యులనియు, అడవిలో పిల్లలను పోగొట్టుకొనిన యెలుగుబంట్ల వంటివారై రేగిన మనస్సుతో ఉన్నారనియు నీకు తెలియును. మరియు నీ తండ్రి యుద్ధమునందు ప్రవీణుడు, అతడు జనులతో కూడ బసచేయడు.",
      "17:9": "అతడేదో యొక గుహయందో మరి ఏ స్థలమందో దాగియుండును. కాబట్టి నీవారిలో కొందరు యుద్ధారంభమందు కూలగా చూచి జనులు వెంటనే ఆ సంగతినిబట్టి అబ్షాలోము పక్షమున నున్నవారు ఓడిపోయిరని చెప్పుకొందురు.",
      "17:11": "కాబట్టి నా ఆలోచన యేమనగా, దానునుండి బెయేర్షెబావరకు లెక్కకు సముద్రపు ఇసుక రేణువులంత విస్తారముగా ఇశ్రాయేలీయులనందరిని నలుదిశలనుండి నీ యొద్దకు సమకూర్చి నీవు స్వయముగా యుద్ధమునకు పోవలెను.",
      "17:12": "అప్పుడు మనము అతడు కనబడిన స్థలములలో ఏదో యొకదానియందు అతనిమీద పడుదుము; నేలమీద మంచుపడురీతిగా మనము అతనిమీదికి వచ్చినయెడల అతని పక్షపువారిలో ఒకడును తప్పించుకొనజాలడు.",
      "17:13": "అతడు ఒక పట్టణములో చొచ్చినయెడల ఇశ్రాయేలీయులందరును ఆ పట్టణమునకు త్రాళ్లు తీసికొనివచ్చి యొక చిన్న రాయి అచ్చట కనబడకుండ దానిని నదిలోనికి లాగుదురు.",
      "17:14": "అబ్షాలోమును ఇశ్రాయేలువారందరును ఈ మాట విని అర్కీయుడగు హూషై చెప్పిన ఆలోచన అహీతోపెలు చెప్పినదానికంటె యుక్తమని యొప్పుకొనిరి; ఏలయనగా యెహోవా అబ్షాలోముమీదికి ఉపద్రవమును రప్పింపగలందులకై అహీతోపెలు చెప్పిన యుక్తిగల ఆలోచనను వ్యర్థముచేయ నిశ్చయించియుండెను.",
      "17:15": "కాబట్టి హూషై అబ్షాలోమునకును ఇశ్రాయేలువారి పెద్దలకందరికిని అహీతోపెలు చెప్పిన ఆలోచనను తాను చెప్పిన ఆలోచనను యాజకులగు సాదోకుతోను అబ్యాతారుతోను తెలియజెప్పి",
      "17:16": "మీరు త్వరపడి ఈ రాత్రి అరణ్యమందు ఏరు దాటు స్థలములలో ఉండవద్దనియు, రాజును అతని సమక్షమందున్న జనులందరును నశింపకుండునట్లు శీఘ్రముగా వెళ్లిపోవుడనియు దావీదునకు వర్తమానము పంపుడని చెప్పెను.",
      "17:17": "తాము పట్టణముతట్టు వచ్చిన సంగతి తెలియబడకయుండునట్లు యోనాతానును అహిమయస్సును ఏన్‌రోగేలు దగ్గర నిలిచియుండగా పనికత్తెయొకతె వచ్చి, హూషై చెప్పిన సంగతిని వారికి తెలియజేయగా వారు వచ్చి రాజైన దావీదుతో దాని తెలియజెప్పిరి.",
      "17:18": "తాను వారిని కనుగొనిన సంగతి పనివాడు ఒకడు అబ్షాలోమునకు తెలిపెను గాని వారిద్దరు వేగిరముగా పోయి బహూరీములో ఒకని యిల్లు చేరి అతని యింటి ముంగిట ఒక బావి యుండగా దానిలో దిగి దాగియుండిరి.",
      "17:19": "ఆ యింటి యిల్లాలు ముతక గుడ్డ యొకటి తీసికొనివచ్చి బావిమీద పరచి దానిపైన గోధుమపిండి ఆరబోసెను గనుక వారు దాగిన సంగతి యెవరికిని తెలియకపోయెను.",
      "17:20": "అబ్షాలోము సేవకులు ఆ యింటి ఆమెయొద్దకు వచ్చి అహిమయస్సును యోనాతానును ఎక్కడ ఉన్నారని అడుగగా ఆమె — వారు ఏరుదాటి పోయిరని వారితో చెప్పెను గనుక వారు పోయి వెదకి వారిని కానక యెరూషలేమునకు తిరిగి వచ్చిరి.",
      "17:22": "దావీదును అతని యొద్దనున్న జనులందరును లేచి యొర్దానునది దాటిరి, తెల్లవారునప్పటికి నది దాటకయుండినవాడు ఒకడును లేకపోయెను.",
      "17:23": "అహీతోపెలు తాను చెప్పిన ఆలోచన జరుగకపోవుట చూచి, గాడిదకు గంతకట్టి యెక్కి తన ఊరనున్న తన యింటికి పోయి తన యిల్లు చక్కబెట్టుకొని ఉరిపోసికొని చనిపోయెను; జనులు అతని తండ్రి సమాధియందు అతనిని పాతిపెట్టిరి.",
      "17:24": "దావీదు మహనయీమునకు రాగా అబ్షాలోమును ఇశ్రాయేలీయులందరును యొర్దాను నది దాటి వచ్చిరి.",
      "17:25": "అబ్షాలోము యోవాబునకు మారుగా అమాశాను సైన్యాధిపతిగా నియమించెను. ఈ అమాశా ఇత్రా అను ఇశ్రాయేలీయుడు యోవాబు తల్లియైన సెరూయా సహోదరియగు నాహాషు కుమార్తెయైన అబీగయీలునొద్దకు పోయినందున పుట్టినవాడు.",
      "17:27": "దావీదు మహనయీమునకు వచ్చినప్పుడు అమ్మోనీయుల రబ్బా పట్టణపువాడైన నాహాషు కుమారుడగు షోబీయును, లోదెబారు ఊరివాడగు అమ్మీయేలు కుమారుడైన మాకీరును, రోగెలీము ఊరివాడును గిలాదీయుడునైన బర్జిల్లయియు",
      "17:28-29": "అరణ్యమందు జనులు అలసినవారై ఆకలిగొని దప్పిగొనియుందురని తలంచి, పరుపులు పాత్రలు కుండలు గోధుమలు యవలు పిండి వేచిన గోధుమలు కాయధాన్యములు చిక్కుడు కాయలు పేలాలు తేనె వెన్న గొఱ్ఱలు జున్నుముద్దలు దావీదును అతనియొద్దనున్న జనులును భోజనము చేయుటకై తీసికొనివచ్చిరి.",
      "18:1": "దావీదు తన యొద్దనున్న జనులను లెక్కించి వారి మీద సహస్రాధిపతులను శతాధిపతులను నిర్ణయించి",
      "18:2": "జనులను మూడు భాగములుగా చేసి యోవాబు చేతిక్రింద ఒక భాగమును సెరూయా కుమారుడగు అబీషై అను యోవాబు సహోదరుని చేతిక్రింద ఒక భాగమును, గిత్తీయుడైన ఇత్తయి చేతిక్రింద ఒక భాగమును ఉంచెను. దావీదు — నేను మీతోకూడ బయలుదేరుదునని జనులతో చెప్పగా",
      "18:3": "జనులు — నీవు రాకూడదు, మేము పారిపోయినను జనులు దానిని లక్ష్యపెట్టరు, మాలో సగము మంది చనిపోయినను జనులు దానిని లక్ష్యపెట్టరు, మావంటి పదివేల మందితో నీవు సాటి; కాబట్టి నీవు పట్టణమందు నిలిచి మాకు సహాయము చేయవలెనని అతనితో చెప్పిరి.",
      "18:5": "అప్పుడు రాజు యోవాబును అబీషైని ఇత్తయిని పిలిచి — నా నిమిత్తమై యౌవనుడైన అబ్షాలోమునకు దయ జూపుడని ఆజ్ఞాపించెను. జనులందరు వినుచుండగా రాజు అబ్షాలోమునుగూర్చి అధిపతులకందరికి ఆజ్ఞ ఇచ్చెను.",
      "18:6": "జనులు ఇశ్రాయేలువారిని ఎదిరించుటకై పొలములోనికి బయలుదేరిన మీదట యుద్ధము ఎఫ్రాయిము వనములో జరుగగా",
      "18:7": "ఇశ్రాయేలువారు దావీదు సేవకుల యెదుట నిలువలేక ఓడిపోయిరి; ఆ దినమున ఇరువది వేల మంది అక్కడ హతులైరి.",
      "18:8": "యుద్ధము ఆ ప్రదేశమంతటను వ్యాపించెను; మరియు నాటి దినమున కత్తిచేత కూలినవారికంటె ఎక్కువమంది అడవిలో చిక్కుబడి నాశనమైరి.",
      "18:9": "అబ్షాలోము కంచరగాడిదమీద ఎక్కి పోవుచు దావీదు సేవకులకు ఎదురాయెను; ఆ కంచరగాడిద యొక గొప్ప మస్తకివృక్షముయొక్క చిక్కుకొమ్మల క్రిందికి పోయినప్పుడు అతని తల చెట్టుకు తగులుకొనినందున అతడు ఎత్తబడి ఆకాశమునకును భూమికిని మధ్యను వ్రేలాడుచుండగా అతని క్రిందనున్న కంచరగాడిద సాగిపోయెను.",
      "18:11": "యోవాబు — నీవు చూచియుంటివే, నేల కూలునట్లు నీవతని కొట్టకపోతివేమి? నీవతని చంపినయెడల పది తులముల వెండియు ఒక నడికట్టును నీకిచ్చియుందునని తనకు సమాచారము చెప్పినవానితో అనెను.",
      "18:12": "అందుకు వాడు — యౌవనుడైన అబ్షాలోమును ఎవడును ముట్టకుండ జాగ్రత్తపడుడని రాజు నీకును అబీషైకిని ఇత్తయికిని ఆజ్ఞ నిచ్చుచుండగా నేను వింటిని; వెయ్యి తులముల వెండి నా చేతిలో పెట్టినను రాజు కుమారుని నేను చంపను.",
      "18:14": "యోవాబు — నీవు చేయువరకు నేను కాచుకొనియుందునా? అని చెప్పి మూడు బాణములు చేత పట్టుకొని పోయి మస్తకివృక్షమున వ్రేలాడుచు ఇంకను ప్రాణముతో నున్న అబ్షాలోముయొక్క గుండెకు గురిపెట్టి",
      "18:15": "తన ఆయుధములను మోయువారు పదిమంది చుట్టు చుట్టుకొనియుండగా అబ్షాలోమును కొట్టి చంపెను.",
      "18:16": "అప్పుడు జనులను ఇక హతము చేయక విడువవలసినదని యోవాబు బాకా ఊదింపగా ఇశ్రాయేలీయులను తరుముకొని పోయిన జనులు తిరిగి వచ్చిరి.",
      "18:17": "జనులు అబ్షాలోముయొక్క కళేబరమును ఎత్తి అడవిలో ఉన్న పెద్దగోతిలో పడవేసి పెద్దరాళ్లకుప్ప దానిమీద పేర్చిన తరువాత ఇశ్రాయేలీయులందరును తమ తమ యిండ్లకు పోయిరి.",
      "18:18": "తన పేరు నిలుపుటకు తనకు కుమారులు లేరనుకొని, అబ్షాలోము తాను బ్రదికియుండగా ఒక స్తంభము తెచ్చి దానిని రాజు లోయలో తన పేరట నిలువబెట్టి, అతడు ఆ స్తంభమునకు తన పేరు పెట్టియుండెను. నేటివరకు అబ్షాలోము స్తంభమని దానికి పేరు.",
      "18:19": "సాదోకు కుమారుడైన అహిమయస్సు — నేను పరుగెత్తికొని పోయి యెహోవా తన శత్రువులను ఓడించి తనకు న్యాయము తీర్చిన వర్తమానము రాజుతో చెప్పెదననగా",
      "18:20": "యోవాబు — ఈ దినమున ఈ వర్తమానము చెప్పతగదు, మరియొక దినమున చెప్పవచ్చును; రాజు కుమారుడు మరణమాయెను గనుక ఈ దినమున వర్తమానము తీసికొనిపోతగదని అతనితో చెప్పెను.",
      "18:21": "తరువాత కూషీని పిలిచి — నీవు పోయి నీవు చూచినదానిని రాజునకు తెలియజేయుమనగా కూషీ యోవాబునకు నమస్కారము చేసి పరుగెత్తికొని పోయెను.",
      "18:23": "అతడు — ఏమైనను సరే నేను పరుగెత్తికొని పోవుదుననెను. అందుకు యోవాబు — పొమ్మని సెలవియ్యగా అహిమయస్సు మైదానపు మార్గమున పరుగెత్తికొని కూషీకంటె ముందుగా చేరెను.",
      "18:24": "దావీదు రెండు గుమ్మముల మధ్యను నడవలో కూర్చొనియుండెను; కావలికాడు గుమ్మముపైనున్న గోడమీదికి ఎక్కి పారచూడగా ఒంటరిగా పరుగెత్తికొని వచ్చుచున్న యొకడు కనబడెను.",
      "18:27": "కావలికాడు మొదటివాడు పరుగెత్తుట చూడగా — వాడు సాదోకు కుమారుడైన అహిమయస్సు అని నాకు తోచుచున్నది అనినప్పుడు రాజు — వాడు మంచివాడు, శుభవర్తమానము తెచ్చుచున్నాడని చెప్పెను.",
      "18:28": "అహిమయస్సు — జయమని బిగ్గరగా రాజుతో చెప్పి రాజు ముందర సాష్టాంగ నమస్కారము చేసి — నా యేలినవాడవును రాజవునగు నిన్ను చంపచూచినవారిని అప్పగించిన నీ దేవుడైన యెహోవాకు స్తోత్రము అని చెప్పెను.",
      "18:29": "రాజు — బాలుడగు అబ్షాలోము క్షేమముగా ఉన్నాడా? అని యడుగగా అహిమయస్సు — యోవాబు రాజసేవకుడనైన నీ దాసుడనగు నన్ను పంపినప్పుడు గొప్ప అల్లరి జరుగుట నేను చూచితిని గాని అది ఏమైనది నాకు తెలిసినది కాదని చెప్పెను.",
      "18:33": "అప్పుడు రాజు బహు కలతపడి గుమ్మమునకు పైగా నున్న గదికి ఎక్కి పోయి యేడ్చుచు, సంచరించుచు — నా కుమారుడా అబ్షాలోమా, నా కుమారుడా అబ్షాలోమా, అయ్యో నా కుమారుడా, నీకు బదులుగా నేను చనిపోయినయెడల ఎంత బాగుండును; నా కుమారుడా అబ్షాలోమా నా కుమారుడా, అని యేడ్చుచు వచ్చెను.",
      "19:2": "యుద్ధమందు సిగ్గుతో పారిపోయిన జనులవలె వారు నాడు దొంగనడకలతో వచ్చి పట్టణములో ప్రవేశించిరి; నాటి విజయము జనులకందరికి దుఃఖమునకు కారణమాయెను.",
      "19:4": "రాజు ముఖము కప్పుకొని — అబ్షాలోమా నా కుమారుడా అబ్షాలోమా నా కుమారుడా నా కుమారుడా, అని కేకలు వేయుచు ఏడ్చుచుండగా,",
      "19:5": "రాజు అబ్షాలోమునుగూర్చి దుఃఖించుచు ఏడ్చుచున్నాడను సంగతి యోవాబు విని నగరియందున్న రాజునొద్దకు వచ్చి — నీ ప్రాణమును నీ కుమారుల ప్రాణములను నీ కుమార్తెల ప్రాణములను నీ భార్యల ప్రాణములను నీ ఉపపత్నుల ప్రాణములను ఈ దినమున రక్షించిన నీ సేవకులనందరిని నేడు సిగ్గుపరచి",
      "19:6": "నీ స్నేహితుల యెడల ప్రేమ చూపక నీ శత్రువులయెడల ప్రేమ చూపుచు, ఈ దినమున అధిపతులును సేవకులును నీకు ఇష్టజనులు కారని నీవు కనుపరచితివి. మేమందరము చనిపోయి అబ్షాలోము బ్రదికియుండినయెడల అది నీకు ఇష్టమగునన్న మాట యీ దినమున నేను తెలిసికొనుచున్నాను. ఇప్పుడు లేచి బయటికివచ్చి నీ సేవకులను ధైర్యపరచుము.",
      "19:7": "నీవు బయటికి రాకయుండినయెడల ఈ రాత్రి యొకడును నీయొద్ద నిలువడని యెహోవా నామమునుబట్టి ప్రమాణము చేసి చెప్పుచున్నాను; నీ బాల్యమునుండి నేటివరకు నీకు ప్రాప్తించిన అపాయములన్నిటికంటె అది నీకు కష్టతరముగా ఉండునని రాజుతో మనవిచేయగా రాజు లేచి వచ్చి గుమ్మములో కూర్చుండెను.",
      "19:8": "రాజు గుమ్మములో కూర్చున్నాడను మాట జనులందరు విని రాజును దర్శింప వచ్చిరిగాని ఇశ్రాయేలువారు తమ తమ యిండ్లకు పారిపోయిరి.",
      "19:9": "అంతట ఇశ్రాయేలువారి గోత్రములకు చేరికైన జనులందరు ఇట్లనుకొనిరి — మన శత్రువుల చేతిలోనుండియు, ఫిలిష్తీయుల చేతిలోనుండియు మనలను విడిపించిన రాజు అబ్షాలోమునకు భయపడి దేశములోనుండి పారిపోయెను.",
      "19:11": "రాజైన దావీదు ఇది విని యాజకులగు సాదోకునకును అబ్యాతారునకును వర్తమానము పంపి — ఇశ్రాయేలువారందరు మాటలాడుకొను సంగతి నగరిలోనున్న రాజునకు వినబడెను గనుక రాజును నగరికి మరల తోడుకొని రాకుండ మీరెందుకు ఆలస్యము చేయుచున్నారు?",
      "19:13": "మరియు అమాశా యొద్దకు దూతలను పంపి — నీవు నాకు ఎముక నంటిన బంధువుడవు మాంసము నంటిన బంధువుడవు కావా? యోవాబునకు బదులు నిన్ను సైన్యాధిపతిగా నేను ఖాయపరచనియెడల దేవుడు గొప్ప అపాయము నాకు కలుగజేయును గాకని చెప్పుడనెను.",
      "19:15": "యూదావారు రాజును ఎదుర్కొనుటకును రాజును నది యివతలకు తోడుకొని వచ్చుటకును గిల్గాలునకు వచ్చిరి.",
      "19:16": "అంతలో బహూరీమునందున్న బెన్యామీనీయుడగు గెరా కుమారుడైన షిమీ త్వరపడి రాజైన దావీదును ఎదుర్కొనుటకై యూదావారితో కూడ వచ్చెను.",
      "19:17": "అతని యొద్ద వెయ్యిమంది బెన్యామీనీయులు ఉండిరి. మరియు సౌలు కుటుంబమునకు సేవకుడగు సీబాయును అతని పదునయిదుగురు కుమారులును అతని యిరువదిమంది దాసులును వచ్చి",
      "19:19": "నా యేలినవాడా, నేను చేసిన ద్రోహము నామీద మోపకుము; నా యేలినవాడవును రాజవునగు నీవు యెరూషలేమును విడిచిన వేళ నీ దాసుడనగు నేను మూర్ఖించి చేసిన దోషమును జ్ఞాపకమందుంచకుము, మనస్సునందుంచుకొనకుము.",
      "19:21": "అంతట సెరూయా కుమారుడగు అబీషై — యెహోవా అభిషేకించినవానిని శపించిన యీ షిమీ మరణమునకు పాత్రుడు కాడా అని యనగా",
      "19:22": "దావీదు — సెరూయా కుమారులారా, మీకును నాకును ఏమి పొందు? ఇట్టి సమయమున మీరు నాకు విరోధులగుదురా? ఇశ్రాయేలువారిలో ఎవరైనను ఈ దినమున మరణశిక్ష నొందుదురా? యిప్పుడు నేను ఇశ్రాయేలువారిమీద రాజునైతినను సంగతి నాకు తెలిసేయున్నదని చెప్పి ప్రమాణముచేసి",
      "19:24": "మరియు సౌలు కుమారుడగు మెఫీబోషెతు రాజును నెదుర్కొనుటకు వచ్చెను. రాజు పారిపోయిన దినము మొదలుకొని అతడు సుఖముగా తిరిగి వచ్చిన నాటివరకు అతడు కాళ్లు కడుగుకొనకయు, గడ్డము కత్తిరించుకొనకయు బట్టలు ఉదుకుకొనకయు నుండెను.",
      "19:25": "రాజును ఎదుర్కొనుటకై అతడు యెరూషలేమునకు రాగా రాజు — మెఫీబోషెతూ, నీవు నాతో కూడ రాకపోతివేమని అతని నడిగెను.",
      "19:26": "అందుకతడు — నా యేలినవాడా రాజా, నీ దాసుడనైన నేను కుంటివాడను గనుక గాడిదమీద గంత కట్టించి యెక్కి రాజుతో కూడ వెళ్లిపోదునని నేననుకొనగా నా పనివాడు నన్ను మోసము చేసెను.",
      "19:27": "సీబా నీ దాసుడనైన నన్ను గూర్చి నా యేలినవాడవును రాజవునగు నీతో అబద్ధమాడెను. అయితే నా యేలినవాడవును రాజవునగు నీవు దేవదూతవంటివాడవు, నీ దృష్టికి ఏది యనుకూలమో దాని చేయుము.",
      "19:29": "రాజు — నీ సంగతులను నీవిక ఎందులకు ఎత్తెదవు? నీవును సీబాయును భూమిని పంచుకొనుడని నేనాజ్ఞ ఇచ్చితిని గదా అనెను.",
      "19:30": "అందుకు మెఫీబోషెతు — నా యేలినవాడవగు నీవు నీ నగరికి తిరిగి క్షేమముగా వచ్చియున్నావు గనుక అతడు అంతయు తీసికొనవచ్చుననెను.",
      "19:31": "మరియు గిలాదీయుడగు బర్జిల్లయి రోగెలీమునుండి యొర్దాను అద్దరికి వచ్చి రాజుతోకూడ నది దాటెను.",
      "19:32": "బర్జిల్లయి యెనుబది సంవత్సరముల వయస్సు కలిగి బహు ముసలివాడై యుండెను. అతడు అధిక ఐశ్వర్యవంతుడు గనుక రాజు మహనయీములో నుండగా అతనికి భోజన పదార్థములను పంపించుచు వచ్చెను.",
      "19:35": "నేటికి నాకు ఎనుబది యేండ్లాయెను. సుఖదుఃఖములకున్న భేదమును నేను గుర్తింపగలనా? అన్నపానముల రుచి నీ దాసుడనైన నేను తెలిసికొనగలనా? గాయకులయొక్కయు గాయకురాండ్రయొక్కయు స్వరము నాకు వినబడునా? కావున నీ దాసుడనగు నేను నా యేలినవాడవును రాజవునగు నీకు ఎందుకు భారముగా నుండవలెను?",
      "19:37": "నేను నా ఊరియందుండి మరణమై నా తలిదండ్రుల సమాధియందు పాతిపెట్టబడుటకై అచ్చటికి తిరిగి పోవునట్లు నాకు సెలవిమ్ము, చిత్తగించుము, నీ దాసుడగు కింహాము నా యేలినవాడవును రాజవునగు నీతోకూడ వచ్చుటకు సెలవిమ్ము; నీ దృష్టికి ఏది యనుకూలమో దానిని అతనికి చేయుమని మనవి చేయగా",
      "19:39": "జనులందరును రాజును నది యవతలకు రాగా రాజు బర్జిల్లయిని ముద్దుపెట్టుకొని దీవించెను; తరువాత బర్జిల్లయి తన స్థలమునకు వెళ్లిపోయెను.",
      "19:43": "అందుకు ఇశ్రాయేలువారు — రాజులో మాకు పది భాగములున్నవి; మీకంటె మేము దావీదునందు అధిక స్వాతంత్ర్యము గలవారము; రాజును తోడుకొని వచ్చుటనుగురించి మీతో ముందుగా మాటలాడినవారము మేమే గదా మీరు మమ్మును నిర్లక్ష్యము చేసితిరేమి? అని యూదావారితో పలికిరి.",
      "20:1": "బెన్యామీనీయుడగు బిక్రి కుమారుడైన షెబయను పనికిమాలినవాడొకడు అచ్చటనుండెను. వాడు — దావీదునందు మనకు భాగము లేదు, యెష్షయి కుమారునియందు మనకు స్వాస్థ్యము ఎంతమాత్రమును లేదు; ఇశ్రాయేలువారలారా, మీరందరు మీ మీ గుడారములకు పొండని బాకా ఊది ప్రకటన చేయగా",
      "20:2": "ఇశ్రాయేలువారందరు దావీదును విడిచి బిక్రి కుమారుడైన షెబను వెంబడించిరి. అయితే యొర్దాను నదినుండి యెరూషలేమువరకు యూదావారు రాజును హత్తుకొనిరి.",
      "20:3": "దావీదు యెరూషలేములోని తన నగరికి వచ్చి, తన యింటికి తాను కాపుగా నుంచిన తన ఉపపత్నులైన పదిమంది స్త్రీలను తీసికొని వారిని కావలిలో ఉంచి వారిని పోషించుచుండెను గాని వారియొద్దకు పోకుండెను; వారు కావలియందుంచబడినవారై బ్రతికినంతకాలము విధవరాండ్రవలె ఉండిరి.",
      "20:4": "తరువాత రాజు అమాశాను పిలువనంపి — మూడు దినములలోగా నీవు నా దగ్గరకు యూదావారినందరిని సమకూర్చి యిక్కడ హాజరు కమ్మని ఆజ్ఞాపించగా",
      "20:6": "దావీదు అబీషైని పిలువనంపి — బిక్రి కుమారుడైన షెబ అబ్షాలోముకంటె మనకు ఎక్కువ కీడుచేయును; వాడు ప్రాకారములుగల పట్టణములలో చొచ్చి మనకు దొరకకపోవునేమో గనుక నీవు నీ యేలినవాని సేవకులను వెంటబెట్టుకొని పోయి వాని తరిమి పట్టుకొనుమని ఆజ్ఞాపించెను.",
      "20:8": "వారు గిబియోనులో ఉన్న పెద్ద బండదగ్గరకు రాగా అమాశా వారిని కలియ వచ్చెను; యోవాబు తాను తొడుగుకొనిన చొక్కాయకు పైన బిగించియున్న నడికట్టుకు వరగల కత్తి కట్టుకొనియుండగా ఆ వర వదులై కత్తి నేలపడెను.",
      "20:9": "అప్పుడు యోవాబు అమాశాతో — నా సహోదరా, నీవు క్షేమముగా ఉన్నావా అనుచు, అమాశాను ముద్దుపెట్టుకొనునట్లుగా కుడిచేత అతని గడ్డము పట్టుకొని",
      "20:10": "అమాశా యోవాబు చేతిలోనున్న కత్తిని చూడకను తన్ను కాపాడుకొనకను ఉండగా యోవాబు అతని కడుపులో దాని గుచ్చెను; గుచ్చినతోడనే అతని పేగులు నేలకు జారి ఆ దెబ్బతోనే అతడు చనిపోయెను.",
      "20:12": "అమాశా రక్తములో పొర్లుచు మార్గమునపడియుండగా అచ్చోటికి వచ్చిన జనులందరు నిలిచియుండుట ఆ మనుష్యుడు చూచి అమాశాను మార్గమునుండి చేనిలోనికి లాగి, మార్గస్థులందరు నిలిచి తేరిచూడకుండ శవముమీద బట్ట కప్పెను.",
      "20:15": "ఈ ప్రకారము వారు వచ్చి ఆబేలు బేత్మయకాయందు బిక్రిని ముట్టడివేసి పట్టణపు ప్రాకారము ఎదుట బురుజు కట్టగా యోవాబు వారందరు ప్రాకారమును పడవేయుటకు దానిని కొట్టిరి.",
      "20:16": "అప్పుడు యుక్తిగల యొక స్త్రీ ప్రాకారము ఎక్కి — ఓహో ఆలకించుడి, ఆలకించుడి, నేను అతనితో మాటలాడునట్లు యోవాబును ఇక్కడికి రమ్మని చెప్పుడని కేకవేయగా యోవాబు ఆమెదగ్గరకు వచ్చెను.",
      "20:18": "అంతట ఆమె — పూర్వకాలమున జనులు ఆబేలునందు సంగతి విచారింపవలెనని చెప్పుట కద్దు; ఆలాగున చేసి కార్యములు ముగించుచు వచ్చిరి.",
      "20:19": "నేను ఇశ్రాయేలునందు నిమ్మళస్థులలోను యథార్థవంతులలోను చేరికయైనదానను; ఇశ్రాయేలీయుల పట్టణములలో ప్రధానమగు ఒక పట్టణమును లయము చేయవలెనని నీవు ఉద్దేశించుచున్నావు; యెహోవా స్వాస్థ్యమును నీవెందుకు నిర్మూలము చేయుదువని చెప్పగా",
      "20:21": "బిక్రి కుమారుడగు షెబ అను ఎఫ్రాయిము మన్యపువాడు ఒకడు రాజైన దావీదుమీద ద్రోహము చేసియున్నాడు; మీరు వానిని మాత్రము అప్పగించుడి; తోడనే నేను ఈ పట్టణము విడిచిపోవుదునని చెప్పగా ఆమె యోవాబుతో — చిత్తము, వాని తల ప్రాకారము పైనుండి పడవేయబడునని చెప్పిపోయి",
      "20:22": "తాను యోవాబుతో పలికిన యుక్తిగల మాటలను జనులందరికి తెలియజేయగా, వారు బిక్రి కుమారుడగు షెబయొక్క తలను ఛేదించి యోవాబు దగ్గర దాని పడవేసిరి. కాగా అతడు బాకా ఊదించిన తరువాత జనులందరును ఆ పట్టణమును విడిచి యెవరి గుడారములకు వారు పోయిరి; యోవాబు యెరూషలేమునకు రాజునొద్దకు తిరిగి వచ్చెను.",
      "20:23": "యోవాబు ఇశ్రాయేలు దండువారందరికి అధిపతియై యుండెను. అయితే కెరేతీయులకును పెలేతీయులకును యెహోయాదా కుమారుడగు బెనాయా అధిపతియై యుండెను.",
      "20:24": "అదోరాము వెట్టిపనులు చేయువారిమీద అధికారియై యుండెను; అహీలూదు కుమారుడగు యెహోషాపాతు రాజ్యపు దస్తావేజులమీద ఉండెను;",
      "20:25": "షెవా లేఖికుడు; సాదోకును అబ్యాతారును యాజకులు;",
      "20:26": "యాయీరీయుడగు ఈరా దావీదునకు సభాముఖ్యుడు.",
      "21:1": "దావీదు కాలమున మూడు సంవత్సరములు విడువకుండ కరవు కలుగగా దావీదు యెహోవాతో మనవి చేసెను. అందుకు యెహోవా ఈలాగున సెలవిచ్చెను — సౌలు గిబియోనీయులను హతముచేసెను గనుక అతనినిబట్టియు, నరహంతకులగు అతని యింటివారినిబట్టియు శిక్షగా ఈ కరవు కలిగెను.",
      "21:2": "గిబియోనీయులు ఇశ్రాయేలీయుల సంబంధికులు కారు, వారు అమోరీయులలో శేషించినవారు. ఇశ్రాయేలీయులు మిమ్మును చంపమని ప్రమాణపూర్వకముగా వారితో చెప్పియుండిరి గాని సౌలు ఇశ్రాయేలు యూదాల వారియందు ఆసక్తిగలవాడై వారిని హతము చేయచూచుచుండెను.",
      "21:3": "రాజగు దావీదు గిబియోనీయులను పిలువనంపి — నేను మీకేమి చేయగోరుదురు? యెహోవా స్వాస్థ్యమును మీరు దీవించునట్లు దోషనివృత్తికై దేనిచేత నేను ప్రాయశ్చిత్తము చేయుదునని వారిని అడుగగా",
      "21:4": "గిబియోనీయులు — సౌలు అతని యింటివారును చేసినదాని నిమిత్తము ప్రాయశ్చిత్తము కలుగుటకై వెండి బంగారులే గాని ఇశ్రాయేలీయులలో ఎవరినైనను చంపుటయే గాని మేము కోరుట లేదనిరి.",
      "21:5-6": "వారు — మాకు శత్రువులై మమ్మును నాశనము చేయుచు ఇశ్రాయేలీయుల సరిహద్దులలో ఉండకుండ మేము లయమగునట్లు మాకు హానిచేయ నుద్దేశించినవాని కుమారులలో ఏడుగురిని మాకప్పగించుము. యెహోవా ఏర్పరచుకొనిన సౌలు గిబియా పట్టణములో యెహోవా సన్నిధిని మేము వారిని ఉరితీసెదమని రాజుతో మనవి చేయగా రాజు — నేను వారిని అప్పగించెదననెను.",
      "21:6": "యెహోవా ఏర్పరచుకొనిన సౌలు గిబియా పట్టణములో యెహోవా సన్నిధిని మేము వారిని ఉరితీసెదమని రాజుతో మనవి చేయగా రాజు — నేను వారిని అప్పగించెదననెను.",
      "21:7": "తానును సౌలు కుమారుడగు యోనాతానును యెహోవా నామమునుబట్టి ప్రమాణము చేసియున్న హేతువుచేత రాజు సౌలు కుమారుడగు యోనాతానునకు పుట్టిన మెఫీబోషెతును అప్పగింపక",
      "21:8": "అయ్యా కుమార్తెయగు రిస్పా సౌలునకు కనిన యిద్దరు కుమారులగు అర్మోనిని మెఫీబోషెతును, సౌలు కుమార్తెయగు మెరాబు మెహూలతీయుడగు బర్జిల్లయి కుమారుడైన అద్రీయేలునకు కనిన అయిదుగురు కుమారులను పట్టుకొని గిబియోనీయులకప్పగించెను.",
      "21:9": "వారు ఈ యేడుగురిని తీసికొనిపోయి కొండమీద యెహోవా సన్నిధిని ఉరితీసిరి. ఆ యేడుగురు ఏకరీతినే చంపబడిరి; కోతకాలమున యవలకోత యారంభమందు వారు మరణమైరి.",
      "21:10": "అయ్యా కుమార్తెయగు రిస్పా గోనెపట్ట తీసికొని కొండపైన పరచుకొని కోతకాలారంభము మొదలుకొని ఆకాశమునుండి వర్షము ఆ కళేబరములమీద కురియువరకు అచ్చటనే యుండి, పగలు ఆకాశపక్షులు వాటిమీద వాలకుండను రాత్రి అడవిమృగములు దగ్గరకు రాకుండను వాటిని కాచుచుండగా",
      "21:12": "కాబట్టి దావీదు పోయి సౌలు ఎముకలను అతని కుమారుడైన యోనాతాను ఎముకలను యాబేష్గిలాదు వారియొద్దనుండి తెప్పించెను. ఫిలిష్తీయులు గిల్బోవలో సౌలును హతము చేసినప్పుడు వారు సౌలును యోనాతానును బేత్షాను పట్టణపు వీధిలో వ్రేలాడగట్టగా యాబేష్గిలాదు వారు వారి యెముకలను అచ్చటనుండి దొంగిలి తెచ్చియుండిరి.",
      "21:14": "సౌలు ఎముకలను అతని కుమారుడైన యోనాతాను ఎముకలను బెన్యామీనీయుల దేశమునకు చేరిన సేలాలోనున్న సౌలు తండ్రియగు కీషు సమాధియందు పాతిపెట్టిరి. రాజు ఈలాగు చేసిన తరువాత దేశముకొరకు చేయబడిన విజ్ఞాపనమును దేవుడంగీకరించెను.",
      "21:15": "ఫిలిష్తీయులకును ఇశ్రాయేలీయులకును యుద్ధము మరల జరుగగా దావీదు తన సేవకులతోకూడ దిగిపోయి ఫిలిష్తీయులతో యుద్ధము చేయునప్పుడు అతడు సొమ్మసిల్లెను.",
      "21:16": "అప్పుడు రెఫాయీయుల సంతతివాడగు ఇష్బిబేనోబ అను ఒకడు ఉండెను. అతడు ధరించియున్న ఖడ్గము క్రొత్తది, వాని యీటె మూడువందల తులముల యెత్తు యిత్తడిగలది — నేను దావీదును చంపెదనని అతడు చెప్పియుండెను.",
      "21:17": "సెరూయా కుమారుడైన అబీషై రాజును ఆదుకొని ఆ ఫిలిష్తీయుని కొట్టి చంపెను. దావీదు జనులు దీనిచూచి, ఇశ్రాయేలీయులకు దీపమగు నీవు ఆరిపోకుండునట్లు నీవు ఇకమీదట మాతోకూడ యుద్ధమునకు రావద్దని అతనిచేత ప్రమాణము చేయించిరి.",
      "21:18": "అటుతరువాత ఫిలిష్తీయులతో గోబుదగ్గర మరల యుద్ధము జరుగగా హూషాతీయుడైన సిబ్బెకై రెఫాయీయుల సంతతివాడగు సఫును చంపెను.",
      "21:19": "తరువాత గోబుదగ్గర ఫిలిష్తీయులతో ఇంకొకసారి యుద్ధము జరుగగా అక్కడ బేత్లెహేమీయుడైన యహరే ఓరెగీము కుమారుడగు ఎల్హానాను గిత్తీయుడైన గొల్యాతు సహోదరుని చంపెను; వాని యీటెకఱ్ఱ నేతగాని దోనె అంత గొప్పది.",
      "21:20": "ఇంకొక యుద్ధము గాతుదగ్గర జరిగెను. అక్కడ మంచి యెత్తరి యొకడుండెను, ఒక్కొక చేతికి ఆరేసి వ్రేళ్లును, ఇరువది నాలుగు వ్రేళ్లు అతని కుండెను. అతడు రెఫాయీయుల సంతతివాడు.",
      "21:21": "అతడు ఇశ్రాయేలీయులను తిరస్కరించుచుండగా దావీదు సహోదరుడైన షిమ్యాకు పుట్టిన యోనాతాను అతనిని చంపెను.",
      "22:1": "యెహోవా తన్ను సౌలుచేతిలోనుండియు, తన శత్రువులందరి చేతిలోనుండియు తప్పించిన దినమున దావీదు ఈ గీత వాక్యములను చెప్పి యెహోవాను స్తోత్రించెను.",
      "22:2": "యెహోవా నా శైలము, నా కోట, నా రక్షకుడు.",
      "22:3": "నా దుర్గము, నేను ఆయనను ఆశ్రయించుదును. నా కేడెము నా రక్షణశృంగము నా ఉన్నతదుర్గము నా ఆశ్రయస్థానము. ఆయనే నాకు రక్షకుడు; బలాత్కారులనుండి నన్ను రక్షించువాడవు నీవే.",
      "22:4": "కీర్తనీయుడైన యెహోవాకు నేను మొఱ్ఱ పెట్టితిని; నా శత్రువుల చేతిలోనుండి ఆయన నన్ను రక్షించెను.",
      "22:5": "మృత్యువుయొక్క అలలు నన్ను చుట్టుకొనగను వరదపొర్లువలె భక్తిహీనులు నా మీదికి వచ్చి నన్ను బెదరించగను",
      "22:6": "పాతాళపాశములు నన్ను అరికట్టగను మరణపు ఉరులు నన్ను ఆవరించగను",
      "22:7": "నా శ్రమలో నేను యెహోవాకు మొఱ్ఱ పెట్టితిని; నా దేవుని ప్రార్థన చేసితిని. ఆయన తన ఆలయములో ఆలకించి నా ప్రార్థన అంగీకరించెను; నా మొఱ్ఱ ఆయన చెవులలో చొచ్చెను.",
      "22:8": "అప్పుడు భూమి కంపించి అదిరెను; పరమండలపు పునాదులు వణకెను; ఆయన కోపింపగా అవి కంపించెను.",
      "22:9": "ఆయన నాసికారంధ్రములలోనుండి పొగ పుట్టెను; ఆయన నోటనుండి అగ్ని వచ్చి దహించెను; నిప్పు కణములను రాజబెట్టెను.",
      "22:11": "కెరూబుమీద ఎక్కి ఆయన యెగిరి వచ్చెను; గాలి రెక్కలమీద ప్రత్యక్షమాయెను.",
      "22:14": "యెహోవా ఆకాశమందు గర్జించెను; సర్వోన్నతుడు ఉరుముధ్వని పుట్టించెను.",
      "22:15": "తన బాణములను ప్రయోగించి శత్రువులను చెదరగొట్టెను; మెరుపులను ప్రయోగించి వారిని తరిమివేసెను.",
      "22:17": "ఉన్నతస్థలములనుండి చెయ్యి చాపి ఆయన నన్ను పట్టుకొనెను; నన్ను పట్టుకొని మహా జలరాసులలోనుండి తీసెను.",
      "22:20": "నేను ఆయనకు ఇష్టుడను గనుక ఆయన నన్ను తప్పించెను.",
      "22:21": "నా నీతినిబట్టి ఆయన నాకు ప్రతిఫలమిచ్చెను; నా నిర్దోషత్వమునుబట్టియే నాకు ప్రతిఫలమిచ్చెను.",
      "22:26": "దయగలవారియెడల నీవు దయ చూపించుదువు; యథార్థవంతులయెడల నీవు యథార్థవంతుడవుగా నుందువు.",
      "22:27": "సద్భావముగల వారియెడల నీవు సద్భావము చూపుదువు; మూర్ఖులయెడల నీవు వికటముగా నుందువు.",
      "22:28": "శ్రమపడువారిని నీవు రక్షించెదవు; గర్విష్ఠులకు విరోధివై వారిని అణచివేసెదవు.",
      "22:29": "యెహోవా, నీవు నాకు దీపమై యున్నావు; యెహోవా చీకటిని నాకు వెలుగుగా చేయును.",
      "22:30": "నీ సహాయముచేత నేను సైన్యములను జయింతును; నా దేవుని సహాయమువలన నేను ప్రాకారములను దాటుదును.",
      "22:31": "దేవుడు యథార్థవంతుడు; యెహోవా వాక్కు నిర్మలము; ఆయన శరణుజొచ్చువారికందరికి ఆయన కేడెము.",
      "22:32": "యెహోవా తప్ప దేవుడేడి? మన దేవుడు తప్ప ఆశ్రయదుర్గమేది?",
      "22:34": "ఆయన నా కాళ్లు జింకకాళ్లవలె చేయును; ఎత్తయిన స్థలములమీద నన్ను నిలుపును.",
      "22:35": "నా చేతులకు యుద్ధముచేయ నేర్పువాడు ఆయనే; నా బాహువులు ఇత్తడి విల్లును ఎక్కుబెట్టును.",
      "22:36": "నీవు నీ రక్షణ కేడెమును నాకు అందించుదువు; నీ సాత్వికము నన్ను గొప్పచేయును.",
      "22:37": "నా పాదములకు చోటు విశాలపరచుదువు; నా చీలమండలు బెణకలేదు.",
      "22:43": "నేల ధూళివలె వారిని నలుగగొట్టెదను; పొడిగా వారిని కొట్టెదను; వీధిలోని పెంటవలె నేను వారిని పారపోసి అణగద్రొక్కెదను.",
      "22:47": "యెహోవా జీవముగలవాడు; నా ఆశ్రయదుర్గమైనవాడు స్తోత్రార్హుడు; నాకు రక్షణాశ్రయ దుర్గమైన దేవుడు మహోన్నతుడగును గాక.",
      "22:51": "నీవు నియమించిన రాజునకు గొప్ప రక్షణ కలుగజేయువాడవు; అభిషేకించిన దావీదునకును అతని సంతానమునకును నిత్యము కనికరము చూపువాడవు.",
      "23:1": "దావీదు రచించిన చివరి మాటలు ఇవే; యెష్షయి కుమారుడగు దావీదు పలికిన దేవోక్తి యిదే; యాకోబు దేవునిచేత అభిషిక్తుడై మహాధిపత్యము నొందినవాడును ఇశ్రాయేలీయుల స్తోత్రగీతములను మధురగానము చేసిన గాయకుడునగు దావీదు పలికిన దేవోక్తి యిదే.",
      "23:2": "యెహోవా ఆత్మ నా ద్వారా పలుకుచున్నాడు; ఆయన వాక్కు నా నోట ఉన్నది.",
      "23:3": "ఇశ్రాయేలీయుల దేవుడు సెలవిచ్చుచున్నాడు; ఇశ్రాయేలీయులకు ఆశ్రయదుర్గమగువాడు నాద్వారా మాటలాడుచున్నాడు — మనుష్యులను ఏలు నొకడు పుట్టును; అతడు నీతిమంతుడై దేవునియందు భయభక్తులు గలిగి యేలును.",
      "23:4": "ఉదయకాలపు సూర్యోదయ కాంతివలెను మబ్బు లేకుండ ఉదయించిన సూర్యునివలెను వర్షము కురిసిన పిమ్మట నిర్మలమైన కాంతిచేత భూమిలోనుండి పుట్టిన లేత గడ్డివలెను అతడు ఉండును.",
      "23:5": "నా సంతతివారు దేవుని దృష్టికి అనుకూలులే గదా; ఆయన నాతో నిత్యనిబంధన చేసియున్నాడు; ఆయన నిబంధన సర్వసంపూర్ణమైన నిబంధనే; అది స్థిరమాయెను, దేవునికి పూర్ణానుకూలము; అది నాకనుగ్రహింపబడిన రక్షణార్థమైనది; నిశ్చయముగా ఆయన దానిని నెరవేర్చును.",
      "23:6": "ఒకడు ముండ్లను చేత పట్టుకొనుటకు భయపడినట్లు దుర్మార్గులు విసర్జింపబడుదురు.",
      "23:8": "దావీదు అనుచరులలో బలాఢ్యులెవరనగా యోషేబెష్షెబెతను ముఖ్యుడగు తక్మోనీయుడు; అతడు ఒక యుద్ధములో ఎనిమిది వందల మందిని హతము చేసెను.",
      "23:9": "ఇతని తరువాతివాడు అహోహీయుడైన దోదో కుమారుడైన ఎలియాజరు, ఇతడు దావీదు ముగ్గురు బలాఢ్యులలో ఒకడు. యుద్ధమునకు కూడివచ్చిన ఫిలిష్తీయులు ఇశ్రాయేలీయులను తిరస్కరించి డీకొని వచ్చినప్పుడు ఇశ్రాయేలీయులు వెళ్లిపోగా ఇతడు లేచి",
      "23:10": "చేయి తిమ్మిరిగొని కత్తి దానికి అంటుకొనిపోవువరకు ఫిలిష్తీయులను హతము చేయుచు వచ్చెను. ఆ దినమున యెహోవా ఇశ్రాయేలీయులకు గొప్ప రక్షణ కలుగజేసెను. దోపుడుసొమ్ము పట్టుకొనుటకు మాత్రము జనులు అతనివెనుక వచ్చిరి.",
      "23:11": "ఇతని తరువాతి వారెవరనగా హరారీయుడగు ఆగే కుమారుడైన షమ్మా; ఫిలిష్తీయులు అలచందల చేనిలో గుంపుకూడగా జనులు ఫిలిష్తీయుల యెదుట నిలువలేక పారిపోయిరి.",
      "23:13": "మరియు ముప్పదిమంది అధిపతులలో శ్రేష్ఠులైన ముగ్గురు కోతకాలమున అదుల్లాము గుహలోనున్న దావీదునొద్దకు వచ్చినప్పుడు ఫిలిష్తీయులు రెఫాయీము లోయలో దండు దిగియుండిరి,",
      "23:14": "దావీదు దుర్గములో నుండెను, ఫిలిష్తీయుల దండు కావలివారు బేత్లెహేములో ఉండిరి.",
      "23:15": "దావీదు — బేత్లెహేము గవిని దగ్గరనున్న బావి నీళ్లు ఎవడైనను నాకు తెచ్చియిచ్చినయెడల ఎంతో సంతోషించెదనని అధికారితో పలుకగా",
      "23:16": "ఆ ముగ్గురు బలాఢ్యులు ఫిలిష్తీయుల దండు కావలివారిని ఓడించి, దారి చేసికొని పోయి బేత్లెహేము గవిని దగ్గరనున్న బావినీళ్లు చేది దావీదునొద్దకు తీసికొనివచ్చిరి; అయితే అతడు ఆ నీళ్లు త్రాగుటకు మనస్సులేక యెహోవా సన్నిధిని పారబోసి — యెహోవా, నేను ఇవి త్రాగను;",
      "23:17": "ప్రాణమునకు తెగించి పోయి తెచ్చినవారి చేతి నీళ్లు త్రాగుదునా? అని చెప్పి త్రాగనొల్లకుండెను. ఆ ముగ్గురు బలాఢ్యులు ఈ కార్యములు చేసిరి.",
      "23:18": "సెరూయా కుమారుడును యోవాబు సహోదరుడునైన అబీషై తన అనుచరులలో ముఖ్యుడు. ఇతడొక యుద్ధములో మూడువందలమందిని హతముచేసి వారిమీద తన యీటెను ఆడించెను. ఇతడు ఆ ముగ్గురిలో పేరుపొందినవాడు.",
      "23:20": "మరియు కబ్సెయేలు ఊరివాడై క్రియలచేత ఘనతనొందిన యొక పరాక్రమశాలికి పుట్టిన యెహోయాదా కుమారుడైన బెనాయా అను నొకడు ఉండెను. ఇతడు మోయాబీయుల సంబంధులగు ఆ యిద్దరు శూరులను హతముచేసెను; మరియు మంచుకాలమున బయలువెడలి బావిలో దాగియున్న యొక సింహమును చంపివేసెను.",
      "23:21": "ఇంకను అతడు సౌందర్యవంతుడైన యొక ఐగుప్తీయుని చంపెను. ఈ ఐగుప్తీయుని చేతిలో ఈటెయుండగా బెనాయా దుడ్డుకఱ్ఱ తీసికొని వాని మీదికి పోయి వాని చేతిలోని యీటె ఊడలాగి దానితోనే వాని చంపెను.",
      "23:23": "ఆ ముప్పదిమందిలో ఘనుడాయెను. అయినను మొదటి ముగ్గురితో సమానుడు కాకపోయెను. దావీదు ఇతనిని తన సభికులలో ఒకనిగా నియమించెను.",
      "23:24": "ఆ ముప్పదిమంది యెవరనగా, యోవాబు సహోదరుడైన అశాహేలు, బేత్లెహేమీయుడగు దోదో కుమారుడగు ఎల్హానాను,",
      "23:39": "హిత్తీయుడైన ఊరియా. వారందరు ముప్పది యేడుగురు.",
      "24:1": "ఇంకొకమారు యెహోవా కోపము ఇశ్రాయేలీయులమీద రగులుకొనగా ఆయన దావీదును వారిమీదికి ప్రేరేపణచేసి — నీవు పోయి ఇశ్రాయేలువారిని యూదావారిని లెక్కించుమని అతనికి ఆజ్ఞ ఇచ్చెను.",
      "24:2": "అందుకు రాజు తన యొద్దనున్న సైన్యాధిపతియైన యోవాబును పిలిచి — జనసంఖ్య యెంతైనది నాకు తెలియగలందులకై దాను మొదలుకొని బెయేర్షెబావరకు ఇశ్రాయేలు గోత్రములలో నీవు సంచారముచేసి వారిని లెక్కించుమని ఆజ్ఞ ఇయ్యగా",
      "24:3": "యోవాబు — జనుల సంఖ్య యెంత యున్నను నా యేలినవాడవును రాజవునగు నీవు బ్రదికియుండగానే దేవుడైన యెహోవా దానిని నూరంతలు ఎక్కువ చేయునుగాక; నా యేలినవాడవును రాజవునగు నీకు ఈ కోరిక ఏల పుట్టెననెను.",
      "24:8": "ఈ ప్రకారము వారు దేశమంతయు సంచరించి తొమ్మిది నెలల ఇరువది దినములకు తిరిగి యెరూషలేమునకు వచ్చిరి.",
      "24:9": "అప్పుడు యోవాబు జనసంఖ్య వెరసి రాజునకు అప్పగించెను; ఇశ్రాయేలువారిలో కత్తి దూయగల యెనిమిది లక్షలమంది యోధులుండిరి; యూదావారిలో అయిదు లక్షలమంది యుండిరి.",
      "24:10": "జనసంఖ్య చూచినందుకై దావీదు మనస్సు కొట్టుకొనగా అతడు — నేను చేసిన పనివలన గొప్ప పాపము కట్టుకొంటిని, నేను ఎంతో అవివేకినై దాని చేసితిని; యెహోవా, కరుణయుంచి నీ దాసుడనైన నా దోషమును పరిహరింపుమని యెహోవాతో మనవి చేయగా",
      "24:11": "ఉదయమున దావీదు లేచినప్పుడు దావీదునకు దీర్ఘదర్శియగు గాదునకు యెహోవా వాక్కు ప్రత్యక్షమై యీలాగు సెలవిచ్చెను",
      "24:12": "నీవు పోయి దావీదుతో ఇట్లనుము — యెహోవా సెలవిచ్చునదేమనగా మూడు విషయములను నీ యెదుట పెట్టుచున్నాను; వాటిలో ఒకదానిని నీవు కోరుకొనినయెడల నేనది నీమీదికి రప్పించెదను.",
      "24:13": "కావున గాదు దావీదునొద్దకు వచ్చి యిట్లని సంగతి తెలియజెప్పెను — నీవు నీ దేశమందు ఏడు సంవత్సరములు క్షామము కలుగుటకు ఒప్పుకొందువా? నిన్ను తరుముచున్న నీ శత్రువుల యెదుట నిలువలేక నీవు మూడు నెలలు పారిపోవుటకు ఒప్పుకొందువా? నీ దేశమందు మూడు దినములు తెగులు రేగుటకు ఒప్పుకొందువా? యోచనచేసి నన్ను పంపినవానికి నేనియ్యవలసిన యుత్తరము నిశ్చయించి తెలియజెప్పుమనెను.",
      "24:14": "అందుకు దావీదు — నాకేమియు తోచకున్నది, గొప్ప చిక్కులలో ఉన్నాను, యెహోవా బహు వాత్సల్యతగలవాడు గనుక మనుష్యుని చేతిలో పడకుండ యెహోవా చేతిలోనే పడుదుము గాక అని గాదుతో అనెను.",
      "24:15": "అందుకు యెహోవా ఇశ్రాయేలీయులమీదికి తెగులు రప్పించగా ఆ దినము ఉదయము మొదలుకొని సమాజకూటపు వేళ వరకు అది జరుగుచుండెను; అందుచేత దానునుండి బెయేర్షెబావరకు డెబ్బది వేలమంది మృతినొందిరి.",
      "24:16": "అయితే దూత యెరూషలేము పైని హస్తము చాపి నాశనము చేయబోయినప్పుడు, యెహోవా ఆ కీడునుగూర్చి సంతాపమొంది — అంతే చాలును, నీ చెయ్యి తీయుమని జనులను నాశనముచేయు దూతకు ఆజ్ఞ ఇచ్చెను. యెహోవా దూత యెబూసీయుడైన అరౌనాయొక్క కళ్లము దగ్గర ఉండగా",
      "24:17": "దావీదు జనులను నాశనము చేసిన దూతను కనుగొని యెహోవాను ఈలాగు ప్రార్థించెను — చిత్తగించుము; పాపము చేసినవాడను నేనే; దుర్మార్గముగా ప్రవర్తించినవాడను నేనే; గొఱ్ఱలవంటి వీరేమి చేసిరి? నన్నును నా తండ్రి యింటివారిని శిక్షించుము.",
      "24:18": "ఆ దినమున గాదు దావీదునొద్దకు వచ్చి — నీవు పోయి యెబూసీయుడైన అరౌనాయొక్క కళ్లములో యెహోవా నామమున ఒక బలిపీఠము కట్టించుమని అతనితో చెప్పగా",
      "24:20": "అరౌనా రాజును అతని సేవకులును తన దాపునకు వచ్చుట చూచి బయలుదేరి రాజునకు సాష్టాంగ నమస్కారము చేసి — నా యేలినవాడవును రాజవునగు నీవు నీ దాసుడనైన నాయొద్దకు వచ్చిన నిమిత్తమేమని అడుగగా",
      "24:21": "దావీదు — ఈ తెగులు మనుష్యులకు తగలకుండ నిలిచిపోవునట్లు యెహోవా నామమున ఒక బలిపీఠము కట్టించుటకై నీయొద్ద ఈ కళ్లమును కొనవలెనని వచ్చితిననెను.",
      "24:22": "అందుకు అరౌనా — నా యేలినవాడవగు నీవు చూచి యేది నీకు అనుకూలమో దాని తీసికొని బలి అర్పించుము; చిత్తగించుము, దహనబలికి ఎడ్లున్నవి, నూర్చుకఱ్ఱ సామానులు కట్టెలుగా అక్కరకు వచ్చును.",
      "24:23": "రాజా, యివన్నియు అరౌనా అను నేను రాజునకు ఇచ్చుచున్నానని చెప్పి — నీ దేవుడైన యెహోవా నిన్ను అంగీకరించును గాక అని రాజుతో అనగా",
      "24:24": "రాజు — నేను ఆలాగు తీసికొనను, వెలయిచ్చి నీయొద్ద కొందును, వెల యియ్యక నేను తీసికొనినదానిని నా దేవుడైన యెహోవాకు దహనబలిగా అర్పించనని అరౌనాతో చెప్పి ఆ కళ్లమును ఎడ్లను ఏబది తులముల వెండికి కొనెను.",
      "24:25": "అక్కడ దావీదు యెహోవా నామమున ఒక బలిపీఠము కట్టించి దహనబలులను సమాధాన బలులను అర్పించెను; యెహోవా దేశముకొరకు చేయబడిన విజ్ఞాపనలను ఆలకింపగా ఆ తెగులు ఆగి ఇశ్రాయేలీయులను విడిచి పోయెను."

    const $ = id => document.getElementById(id);
    let idx = 0, A = [];

    function norm(s) {
      return (s || "")
        .replace(/[\s\u200b\u200c\u200d]/g, "")
        .replace(/[.,!?;:'"“”‘’()\-–—।]/g, "")
        .trim();
    }
    function check(input, keys) {
      const n = norm(input);
      if (n.length < 2) return false;
      return keys.some(k => { const nk = norm(k); return nk && (n.includes(nk) || nk.includes(n)); });
    }
    function scoreCount() { return A.filter(a => a && (a.correct || a.selfMarked)).length; }
    function doneCount() { return A.filter(a => a && a.done).length; }

    function buildChapterSelect() {
      const sel = $('chapSel'); sel.innerHTML = '';
      const seen = {};
      Q.forEach((q, i) => { if (!(q.c in seen)) seen[q.c] = i; });
      Object.keys(seen).sort((a, b) => a - b).forEach(c => {
        const o = document.createElement('option');
        o.value = seen[c]; o.textContent = 'అధ్యా. ' + c;
        sel.appendChild(o);
      });
      sel.onchange = () => { idx = +sel.value; render(); };
    }

    function start() {
      idx = 0;
      A = Q.map(() => ({ typed: "", done: false, correct: false, selfMarked: false, shown: false }));
      $('start').classList.add('hidden');
      $('result').classList.add('hidden');
      $('quiz').classList.remove('hidden');
      buildChapterSelect();
      render();
    }

    function render() {
      const item = Q[idx], cur = A[idx];
      $('counter').textContent = `${idx + 1} / ${Q.length}`;
      $('fill').style.width = `${doneCount() / Q.length * 100}%`;
      $('scorepill').textContent = `✦ ${scoreCount()}`;
      $('qtag').textContent = `2 సమూయేలు ${item.r}`;
      $('qtext').textContent = item.q;
      $('chapSel').value = [...$('chapSel').options].filter(o => +o.value <= idx).pop().value;

      const inp = $('input');
      inp.value = cur.typed || "";

      $('prevBtn').disabled = (idx === 0);
      $('nextBtn').textContent = (idx === Q.length - 1) ? 'ఫలితము చూడు' : 'తరువాత →';

      if (cur.done) {
        inp.disabled = true;
        $('submitBtn').classList.add('hidden');
        $('showBtn').classList.add('hidden');
        $('model').classList.remove('hidden');
        $('model').innerHTML = `<span class="lab">సరైన జవాబు:</span>${item.a}`;
        const vt = V[item.r];
        if (vt) {
          $('scripture').classList.remove('hidden');
          $('scripture').innerHTML = `${vt}<span class="ref">— 2 సమూయేలు ${item.r}</span>`;
        } else { $('scripture').classList.add('hidden'); }
        if (cur.correct || cur.selfMarked) {
          $('verdict').className = "verdict ok";
          $('verdict').textContent = (cur.selfMarked && !cur.correct) ? "✦ సరైనదిగా లెక్కించబడింది" : "✦ సరైనది";
          $('markBtn').classList.add('hidden');
        } else if (cur.shown) {
          $('verdict').className = "verdict neutral";
          $('verdict').textContent = "👁 జవాబు చూపబడింది";
          $('markBtn').classList.add('hidden');
        } else {
          $('verdict').className = "verdict no";
          $('verdict').textContent = "✕ తప్పు";
          $('markBtn').classList.remove('hidden');
        }
      } else {
        inp.disabled = false;
        $('submitBtn').classList.remove('hidden');
        $('submitBtn').disabled = (inp.value.trim() === "");
        $('showBtn').classList.remove('hidden');
        $('verdict').textContent = ""; $('verdict').className = "verdict";
        $('model').classList.add('hidden'); $('model').textContent = "";
        $('scripture').classList.add('hidden'); $('scripture').textContent = "";
        $('markBtn').classList.add('hidden');
      }
      const qt = $('qtext'); qt.classList.remove('fade'); void qt.offsetWidth; qt.classList.add('fade');
      if (!cur.done) inp.focus(); else $('nextBtn').focus();
    }

    function submit() {
      const cur = A[idx];
      if (cur.done) return;
      if ($('input').value.trim() === "") return;   // never act on an empty field
      cur.typed = $('input').value;
      cur.correct = check(cur.typed, Q[idx].k);
      cur.done = true; cur.shown = false;
      render();
    }
    function showAnswer() {
      const cur = A[idx];
      if (cur.done) return;
      cur.typed = $('input').value;
      cur.done = true; cur.shown = true; cur.correct = false;
      render();
    }
    function selfMark() {
      const cur = A[idx];
      if (cur.correct || cur.selfMarked) return;
      cur.selfMarked = true;
      render();
    }
    function prev() { if (idx > 0) { idx--; render(); } }
    function next() {
      if (idx < Q.length - 1) { idx++; render(); }
      else finish();
    }

    function finish() {
      const score = scoreCount();
      $('quiz').classList.add('hidden');
      $('result').classList.remove('hidden');
      $('result').classList.add('fade');
      $('scoreNum').textContent = score;
      $('scoreDen').textContent = score;
      const pct = score / Q.length;
      let v;
      if (pct === 1) v = `"యెహోవా నా శైలము, నా కోట, నా రక్షకుడు."<span class="cite">సంపూర్ణము! — 2 సమూయేలు 22:2</span>`;
      else if (pct >= .75) v = `"యెహోవా వాక్కు నిర్మలము; ఆయన శరణుజొచ్చువారికందరికి ఆయన కేడెము."<span class="cite">బహు చక్కగా — 2 సమూయేలు 22:31</span>`;
      else if (pct >= .5) v = `"నీ సహాయముచేత నేను సైన్యములను జయింతును."<span class="cite">మంచి ప్రయత్నము — 2 సమూయేలు 22:30</span>`;
      else v = `"నేను పాపము చేసితిని."<span class="cite">మరల చదివి ప్రయత్నించండి — 2 సమూయేలు 12:13</span>`;
      $('verse').innerHTML = v;
    }

    $('startBtn').onclick = start;
    $('againBtn').onclick = start;
    $('submitBtn').onclick = submit;
    $('showBtn').onclick = showAnswer;
    $('markBtn').onclick = selfMark;
    $('prevBtn').onclick = prev;
    $('nextBtn').onclick = next;

    $('input').addEventListener('input', () => {
      A[idx].typed = $('input').value;
      if (!A[idx].done) $('submitBtn').disabled = ($('input').value.trim() === "");
    });
    // Enter submits a typed answer only — it never skips or navigates
    $('input').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
  </script>
</body>

</html>
